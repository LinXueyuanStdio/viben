version: 2
updates:
  # Python dependencies
  - package-ecosystem: pip
    directory: /backend/browse-mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"

