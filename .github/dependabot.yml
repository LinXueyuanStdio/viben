version: 2
updates:
  # Python dependencies
  - package-ecosystem: pip
    directory: /backend/browse-mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directory: /backend/plugins/browse-mcp-plugin-context7
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directory: /backend/plugins/browse-mcp-plugin-social-media
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"

  # pnpm workspace dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # TypeScript 6 有大量 breaking changes，需要整体迁移
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
      # React 19 需要整体迁移（新 hooks API、Suspense 变化、移除旧 API）
      - dependency-name: "react"
        versions: [">=19.0.0"]
      - dependency-name: "react-dom"
        versions: [">=19.0.0"]
      - dependency-name: "@types/react"
        versions: [">=19.0.0"]
      # react-markdown 10 要求 React 19，且有 breaking API 变更
      - dependency-name: "react-markdown"
        versions: [">=10.0.0"]
      # vitest 4 有 breaking changes（配置格式、API 变更）
      - dependency-name: "vitest"
        versions: [">=4.0.0"]

