name: CodeQL Security Analysis

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'backend/**'
      - '.github/workflows/codeql-analysis.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'backend/**'
      - '.github/workflows/codeql-analysis.yml'
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.GH_PAT }}

      # Setup for JavaScript/TypeScript analysis
      - name: Setup Node.js
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        if: matrix.language == 'javascript-typescript'
        uses: pnpm/action-setup@v6.0.9

      # Setup for Python analysis
      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Poetry
        if: matrix.language == 'python'
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install Python dependencies
        if: matrix.language == 'python'
        run: |
          # Install dependencies for each Python project
          for dir in backend/browse-mcp backend/plugins/browse-mcp-plugin-context7 backend/plugins/browse-mcp-plugin-social-media; do
            if [ -f "$dir/pyproject.toml" ]; then
              echo "Installing dependencies in $dir"
              cd "$dir"
              poetry install --no-interaction --no-root || true
              cd - > /dev/null
            fi
          done

      # Initialize CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: ${{ matrix.language }}
          # Use security-extended queries for comprehensive security analysis
          queries: security-extended
          # Specify source roots for better analysis
          source-root: ${{ matrix.language == 'javascript-typescript' && '.' || 'backend' }}

      # Autobuild attempts to build any compiled languages
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.4

      # Perform CodeQL Analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: '/language:${{ matrix.language }}'
