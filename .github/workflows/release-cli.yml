name: Release CLI

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0). Leave empty to use version from package.json'
        required: false
        type: string
      publish_npm:
        description: 'Publish to npm'
        type: boolean
        default: true
      update_homebrew:
        description: 'Update Homebrew formula'
        type: boolean
        default: true

# Ensure only one release workflow runs at a time
concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get version
        id: get-version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -n "${{ inputs.version }}" ]]; then
              VERSION="${{ inputs.version }}"
            else
              VERSION=$(jq -r '.version' apps/cli/package.json)
            fi
          else
            # Tag trigger - extract version from tag (cli-v0.1.0 -> 0.1.0)
            VERSION="${GITHUB_REF_NAME#cli-v}"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=cli-v${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

  release:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update version in package.json
        run: |
          cd apps/cli
          VERSION="${{ needs.prepare.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v' package.json > package.tmp.json
          mv package.tmp.json package.json
          echo "Updated version to: $(jq -r '.version' package.json)"

      - name: Prepare install.sh for release
        run: |
          # Make install.sh executable
          chmod +x scripts/install.sh

          # Create release directory
          mkdir -p release-assets

          # Copy install.sh
          cp scripts/install.sh release-assets/install.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Viben CLI v${{ needs.prepare.outputs.version }}
          body: |
            ## Viben CLI v${{ needs.prepare.outputs.version }}

            ### Installation Methods

            #### 1. Shell Script (macOS/Linux)
            ```bash
            curl -fsSL https://github.com/LinXueyuanStdio/viben/releases/latest/download/install.sh | bash
            ```

            #### 2. npx (Node.js 18+)
            ```bash
            npx viben
            ```

            #### 3. npm Global Install
            ```bash
            npm install -g viben
            viben
            ```

            #### 4. Homebrew (macOS/Linux)
            ```bash
            brew tap LinXueyuanStdio/viben
            brew install viben
            ```

            ### Requirements
            - Node.js 18+

            ### Links
            - [Documentation](https://github.com/LinXueyuanStdio/viben)
            - [npm Package](https://www.npmjs.com/package/viben)
          files: |
            release-assets/install.sh
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: [prepare, release]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.publish_npm == true }}
    outputs:
      sha256: ${{ steps.get-sha256.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI package and dependencies
        run: pnpm --filter viben... build

      - name: Update version in package.json
        run: |
          cd apps/cli
          VERSION="${{ needs.prepare.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v' package.json > package.tmp.json
          mv package.tmp.json package.json
          echo "Updated version to: $(jq -r '.version' package.json)"

      - name: Publish to npm
        run: |
          cd apps/cli
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for npm propagation
        run: sleep 30

      - name: Get package SHA256
        id: get-sha256
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          SHA256=$(curl -sL "https://registry.npmjs.org/viben/-/viben-${VERSION}.tgz" | shasum -a 256 | cut -d' ' -f1)
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT
          echo "Package SHA256: ${SHA256}"

  update-homebrew:
    needs: [prepare, publish-npm]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'push' || inputs.update_homebrew == true) && needs.publish-npm.outputs.sha256 != '' }}
    steps:
      - name: Checkout homebrew-viben
        uses: actions/checkout@v6
        with:
          repository: LinXueyuanStdio/homebrew-viben
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-viben
        continue-on-error: true

      - name: Check if tap exists
        id: check-tap
        run: |
          if [ -d "homebrew-viben" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::warning::Homebrew tap repository not found. Skipping formula update."
          fi

      - name: Update formula
        if: steps.check-tap.outputs.exists == 'true'
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          SHA256="${{ needs.publish-npm.outputs.sha256 }}"

          cd homebrew-viben

          # Create Formula directory if it doesn't exist
          mkdir -p Formula

          # Generate the formula
          cat > Formula/viben.rb << 'EOF'
          class Viben < Formula
            desc "Orchestrate AI agent clusters in your local workspace"
            homepage "https://github.com/LinXueyuanStdio/viben"
            url "https://registry.npmjs.org/viben/-/viben-VERSION_PLACEHOLDER.tgz"
            sha256 "SHA256_PLACEHOLDER"
            license "MIT"

            depends_on "node@20"

            def install
              system "npm", "install", *std_npm_args
              bin.install_symlink Dir["#{libexec}/bin/*"]
            end

            test do
              assert_match "Viben CLI", shell_output("#{bin}/viben --help")
            end
          end
          EOF

          # Replace placeholders
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" Formula/viben.rb
          sed -i "s/SHA256_PLACEHOLDER/${SHA256}/g" Formula/viben.rb

          echo "Updated formula:"
          cat Formula/viben.rb

      - name: Commit and push
        if: steps.check-tap.outputs.exists == 'true'
        run: |
          cd homebrew-viben
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/viben.rb
          git diff --cached --quiet || git commit -m "Update viben to ${{ needs.prepare.outputs.version }}"
          git push
