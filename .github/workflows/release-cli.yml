name: Release CLI

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0). Leave empty to use version from package.json'
        required: false
        type: string
      publish_npm:
        description: 'Publish to npm'
        type: boolean
        default: true
      update_homebrew:
        description: 'Update Homebrew formula'
        type: boolean
        default: true
      dry_run:
        description: 'Dry run (build and test only, skip publishing)'
        type: boolean
        default: true

# Ensure only one release workflow runs at a time
concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

env:
  # Opt into Node.js 24 for GitHub Actions to avoid deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # =============================================================================
  # PREPARE: Extract version and determine release targets
  # =============================================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-version.outputs.tag }}
      publish_npm: ${{ steps.get-version.outputs.publish_npm }}
      update_homebrew: ${{ steps.get-version.outputs.update_homebrew }}
      dry_run: ${{ steps.get-version.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get version and determine release targets
        id: get-version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -n "${{ inputs.version }}" ]]; then
              VERSION="${{ inputs.version }}"
            else
              VERSION=$(jq -r '.version' package.json)
            fi
            PUBLISH_NPM="${{ inputs.publish_npm }}"
            UPDATE_HOMEBREW="${{ inputs.update_homebrew }}"
            DRY_RUN="${{ inputs.dry_run }}"
          else
            # Tag trigger - extract version from tag (cli-v0.1.0 -> 0.1.0)
            VERSION="${GITHUB_REF_NAME#cli-v}"
            PUBLISH_NPM="true"
            UPDATE_HOMEBREW="true"
            DRY_RUN="false"
          fi

          {
            echo "version=${VERSION}"
            echo "tag=cli-v${VERSION}"
            echo "publish_npm=${PUBLISH_NPM}"
            echo "update_homebrew=${UPDATE_HOMEBREW}"
            echo "dry_run=${DRY_RUN}"
          } >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "CLI Release Configuration:"
          echo "  Version: ${VERSION}"
          echo "  Tag: cli-v${VERSION}"
          echo "  Publish npm: ${PUBLISH_NPM}"
          echo "  Update Homebrew: ${UPDATE_HOMEBREW}"
          echo "  Dry run: ${DRY_RUN}"
          echo "=========================================="

  # =============================================================================
  # BUILD CLI: Build the Node.js/npm CLI package
  # =============================================================================
  build-cli:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Sync version to package files
        shell: bash
        run: ./scripts/sync-version.sh "${{ needs.prepare.outputs.version }}"

      - name: Build @viben/core
        run: pnpm turbo build --filter=@viben/core

      - name: Build viben CLI
        run: pnpm turbo build --filter=viben

      - name: Upload CLI build artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-build
          path: |
            apps/cli/dist/
            apps/cli/package.json
            apps/cli/README.md
          retention-days: 1

  # =============================================================================
  # TEST CLI: Verify the Node.js/npm CLI flavor before publishing
  # =============================================================================
  test-cli:
    needs: [prepare, build-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Download CLI build artifact
        uses: actions/download-artifact@v8
        with:
          name: cli-build
          path: apps/cli

      - name: Make Node.js CLI executable
        run: chmod +x apps/cli/dist/index.js

      - name: Run Node.js CLI integration tests
        run: |
          node apps/cli/dist/index.js --version
          node apps/cli/dist/index.js --help
          chmod +x scripts/test-cli.sh
          ./scripts/test-cli.sh --local

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cli-test-results
          path: |
            test-results/
            *.log
          retention-days: 7
          if-no-files-found: ignore

  # =============================================================================
  # RELEASE CLI: Publish the tested CLI artifact to npm
  # =============================================================================
  release-cli:
    needs: [prepare, build-cli, test-cli]
    if: |
      needs.prepare.outputs.publish_npm == 'true' &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.test-cli.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.get-sha256.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          install: 'false'
          registry-url: 'https://registry.npmjs.org'

      - name: Download CLI build artifact
        uses: actions/download-artifact@v8
        with:
          name: cli-build
          path: apps/cli

      - name: Verify CLI build artifacts
        run: |
          echo "=== CLI artifacts ==="
          ls -la apps/cli/
          ls -la apps/cli/dist/
          echo "=== Version check ==="
          echo "CLI version: $(jq -r '.version' apps/cli/package.json)"

      - name: Verify no workspace protocol references in runtime dependencies
        run: |
          cd apps/cli
          WORKSPACE_REFS=$(jq -r '
            [(.dependencies // {}), (.optionalDependencies // {})]
            | map(to_entries[])
            | map(select(.value | test("^workspace:")))
            | map("\(.key): \(.value)")
            | .[]' package.json)
          if [ -n "$WORKSPACE_REFS" ]; then
            echo "::error::Runtime dependencies contain workspace: protocol references that will break npm install"
            echo "$WORKSPACE_REFS"
            exit 1
          fi
          echo "[OK] No workspace: protocol references in runtime dependencies"

      - name: Check npm package version
        id: check-npm
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          if npm view "viben@${VERSION}" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "viben@${VERSION} is already published; skipping npm publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "viben@${VERSION} is not published yet."
          fi

      - name: Publish to npm
        if: steps.check-npm.outputs.published != 'true'
        run: |
          cd apps/cli
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for npm propagation and get SHA256
        id: get-sha256
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          PACKAGE_URL="https://registry.npmjs.org/viben/-/viben-${VERSION}.tgz"

          echo "Waiting for npm package to be available..."
          for i in {1..60}; do
            if curl -sf "$PACKAGE_URL" -o /tmp/package.tgz; then
              echo "Package available after $((i*10)) seconds"
              SHA256=$(shasum -a 256 /tmp/package.tgz | cut -d' ' -f1)
              echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
              echo "Package SHA256: ${SHA256}"
              exit 0
            fi
            echo "Waiting for npm propagation... attempt $i/60"
            sleep 10
          done

          echo "::error::Package not available after 10 minutes"
          exit 1

      - name: Prepare install.sh for release
        run: |
          chmod +x scripts/install.sh
          mkdir -p release-assets
          cp scripts/install.sh release-assets/install.sh

      - name: Upload CLI assets
        uses: actions/upload-artifact@v7
        with:
          name: cli-assets
          path: release-assets/
          retention-days: 1

  # =============================================================================
  # GITHUB RELEASE: Create release only after npm publish succeeds
  # =============================================================================
  github-release:
    needs: [prepare, release-cli]
    if: needs.release-cli.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create release directory
        run: mkdir -p release-assets

      - name: Download CLI assets
        uses: actions/download-artifact@v8
        with:
          name: cli-assets
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Viben CLI v${{ needs.prepare.outputs.version }}
          body: |
            ## Viben CLI v${{ needs.prepare.outputs.version }}

            ### Installation Methods

            #### Shell Script (macOS/Linux)
            ```bash
            curl -fsSL https://github.com/LinXueyuanStdio/viben/releases/download/${{ needs.prepare.outputs.tag }}/install.sh | bash
            ```

            #### npx (macOS/Linux/Windows, Node.js 18+)
            ```bash
            npx viben
            ```

            #### npm Global Install (macOS/Linux/Windows)
            ```bash
            npm install -g viben
            viben
            ```

            #### Homebrew (macOS/Linux)
            ```bash
            brew tap LinXueyuanStdio/viben
            brew install viben
            ```

            ### Requirements
            - Node.js 18+

            > Windows users: Use `npm install -g viben` or `npx viben`. Requires [Node.js 18+](https://nodejs.org).

            ### Links
            - [Documentation](https://github.com/LinXueyuanStdio/viben)
            - [npm Package](https://www.npmjs.com/package/viben)
          files: |
            release-assets/install.sh
          draft: false
          make_latest: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate releases.json
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
        run: |
          INSTALL_SH_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/install.sh"

          cat > release-assets/releases.json << EOF
          {
            "version": "${VERSION}",
            "tag": "${TAG_NAME}",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "repository": "${{ github.repository }}",
            "components": {
              "cli": true,
              "desktop": false
            },
            "cli": {
              "install_methods": {
                "shell": {
                  "command": "curl -fsSL ${INSTALL_SH_URL} | bash",
                  "platforms": ["macos", "linux"]
                },
                "npx": {
                  "command": "npx viben",
                  "platforms": ["macos", "linux", "windows"]
                },
                "npm": {
                  "command": "npm install -g viben",
                  "platforms": ["macos", "linux", "windows"]
                },
                "homebrew": {
                  "command": "brew tap LinXueyuanStdio/viben && brew install viben",
                  "platforms": ["macos", "linux"]
                }
              },
              "assets": {
                "install_sh": {
                  "url": "${INSTALL_SH_URL}",
                  "name": "install.sh"
                }
              }
            },
            "desktop": {
              "assets": {
                "macos": {
                  "arm64": {
                    "url": "",
                    "name": ""
                  },
                  "x64": {
                    "url": "",
                    "name": ""
                  }
                },
                "windows": {
                  "msi": {
                    "url": "",
                    "name": ""
                  },
                  "exe": {
                    "url": "",
                    "name": ""
                  }
                },
                "linux": {
                  "deb": {
                    "url": "",
                    "name": ""
                  }
                }
              }
            },
            "links": {
              "npm": "https://www.npmjs.com/package/viben",
              "documentation": "https://github.com/${{ github.repository }}",
              "changelog": "https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md"
            }
          }
          EOF

          echo "Generated releases.json:"
          cat release-assets/releases.json

      - name: Upload releases.json to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: release-assets/releases.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =============================================================================
  # HOMEBREW UPDATE: Update formula after npm publish
  # =============================================================================
  update-homebrew:
    needs: [prepare, release-cli]
    runs-on: ubuntu-latest
    if: |
      needs.prepare.outputs.update_homebrew == 'true' &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.release-cli.outputs.sha256 != ''
    steps:
      - name: Checkout homebrew-viben
        uses: actions/checkout@v6
        with:
          repository: LinXueyuanStdio/homebrew-viben
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-viben
        continue-on-error: true

      - name: Check if tap exists
        id: check-tap
        run: |
          if [ -d "homebrew-viben" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Homebrew tap repository not found. Skipping formula update."
          fi

      - name: Update formula
        if: steps.check-tap.outputs.exists == 'true'
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          SHA256="${{ needs.release-cli.outputs.sha256 }}"

          cd homebrew-viben
          mkdir -p Formula

          cat > Formula/viben.rb << EOF
          class Viben < Formula
            desc "Orchestrate AI agent clusters in your local workspace"
            homepage "https://github.com/LinXueyuanStdio/viben"
            url "https://registry.npmjs.org/viben/-/viben-${VERSION}.tgz"
            sha256 "${SHA256}"
            license "MIT"

            depends_on "node"

            def install
              system "npm", "install", *std_npm_args
              bin.install_symlink Dir["#{libexec}/bin/*"]
            end

            test do
              assert_match "Viben CLI", shell_output("#{bin}/viben --help")
            end
          end
          EOF

          echo "Updated formula:"
          cat Formula/viben.rb

      - name: Commit and push
        if: steps.check-tap.outputs.exists == 'true'
        run: |
          cd homebrew-viben
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/viben.rb
          git diff --cached --quiet || git commit -m "Update viben to ${{ needs.prepare.outputs.version }}"
          git push
