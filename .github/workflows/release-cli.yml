name: Release CLI

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0). Leave empty to use version from package.json'
        required: false
        type: string
      publish_npm:
        description: 'Publish to npm'
        type: boolean
        default: true
      update_homebrew:
        description: 'Update Homebrew formula'
        type: boolean
        default: true

# Ensure only one release workflow runs at a time
concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

env:
  # Opt into Node.js 24 for GitHub Actions to avoid deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get version
        id: get-version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -n "${{ inputs.version }}" ]]; then
              VERSION="${{ inputs.version }}"
            else
              VERSION=$(jq -r '.version' apps/cli/package.json)
            fi
          else
            # Tag trigger - extract version from tag (cli-v0.1.0 -> 0.1.0)
            VERSION="${GITHUB_REF_NAME#cli-v}"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=cli-v${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

  release:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare install.sh for release
        run: |
          # Make install.sh executable
          chmod +x scripts/install.sh

          # Create release directory
          mkdir -p release-assets

          # Copy install.sh
          cp scripts/install.sh release-assets/install.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Viben CLI v${{ needs.prepare.outputs.version }}
          body: |
            ## Viben CLI v${{ needs.prepare.outputs.version }}

            ### Installation Methods

            #### 1. Shell Script (macOS/Linux)
            ```bash
            curl -fsSL https://github.com/LinXueyuanStdio/viben/releases/latest/download/install.sh | bash
            ```

            #### 2. npx (macOS/Linux/Windows, Node.js 18+)
            ```bash
            npx viben
            ```

            #### 3. npm Global Install (macOS/Linux/Windows)
            ```bash
            npm install -g viben
            viben
            ```

            #### 4. Homebrew (macOS/Linux)
            ```bash
            brew tap LinXueyuanStdio/viben
            brew install viben
            ```

            ### Requirements
            - Node.js 18+

            > 💡 **Windows users**: Use `npm install -g viben` or `npx viben`. Requires [Node.js 18+](https://nodejs.org).

            ### Links
            - [Documentation](https://github.com/LinXueyuanStdio/viben)
            - [npm Package](https://www.npmjs.com/package/viben)
          files: |
            release-assets/install.sh
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate cli-releases.json
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
        run: |
          INSTALL_SH_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/install.sh"

          cat > release-assets/cli-releases.json << EOF
          {
            "version": "${VERSION}",
            "tag": "${TAG_NAME}",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "repository": "${{ github.repository }}",
            "install_methods": {
              "shell": {
                "command": "curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | bash",
                "platforms": ["macos", "linux"]
              },
              "npx": {
                "command": "npx viben",
                "platforms": ["macos", "linux", "windows"]
              },
              "npm": {
                "command": "npm install -g viben",
                "platforms": ["macos", "linux", "windows"]
              },
              "homebrew": {
                "command": "brew tap LinXueyuanStdio/viben && brew install viben",
                "platforms": ["macos", "linux"]
              }
            },
            "assets": {
              "install_sh": {
                "url": "${INSTALL_SH_URL}",
                "name": "install.sh"
              }
            },
            "links": {
              "npm": "https://www.npmjs.com/package/viben",
              "documentation": "https://github.com/${{ github.repository }}"
            }
          }
          EOF

          echo "Generated cli-releases.json:"
          cat release-assets/cli-releases.json

      - name: Upload releases JSON to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: release-assets/cli-releases.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: [prepare, release]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.publish_npm == true }}
    outputs:
      sha256: ${{ steps.get-sha256.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Sync version to package files
        run: ./scripts/sync-version.sh "${{ needs.prepare.outputs.version }}"

      - name: Build @viben/core
        run: pnpm turbo build --filter=@viben/core

      - name: Build apps/cli package
        run: pnpm turbo build --filter=viben

      - name: Test Node CLI package
        run: |
          node apps/cli/dist/index.js --version
          node apps/cli/dist/index.js --help
          chmod +x scripts/test-cli.sh
          ./scripts/test-cli.sh --local

      - name: Verify CLI build artifacts
        run: |
          echo "=== CLI artifacts ==="
          ls -la apps/cli/
          ls -la apps/cli/dist/
          echo "=== Version check ==="
          echo "CLI version: $(jq -r '.version' apps/cli/package.json)"

      - name: Verify no workspace protocol references in runtime dependencies
        run: |
          cd apps/cli
          WORKSPACE_REFS=$(jq -r '
            [(.dependencies // {}), (.optionalDependencies // {})]
            | map(to_entries[])
            | map(select(.value | test("^workspace:")))
            | map("\(.key): \(.value)")
            | .[]' package.json)
          if [ -n "$WORKSPACE_REFS" ]; then
            echo "::error::Runtime dependencies contain workspace: protocol references that will break npm install"
            echo "$WORKSPACE_REFS"
            exit 1
          fi
          echo "✅ No workspace: protocol references in runtime dependencies"

      - name: Publish to npm
        run: |
          cd apps/cli
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for npm propagation and get SHA256
        id: get-sha256
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          PACKAGE_URL="https://registry.npmjs.org/viben/-/viben-${VERSION}.tgz"

          echo "Waiting for npm package to be available..."
          for i in {1..60}; do
            if curl -sf "$PACKAGE_URL" -o /tmp/package.tgz; then
              echo "Package available after $((i*10)) seconds"
              SHA256=$(shasum -a 256 /tmp/package.tgz | cut -d' ' -f1)
              echo "sha256=${SHA256}" >> $GITHUB_OUTPUT
              echo "Package SHA256: ${SHA256}"
              exit 0
            fi
            echo "Waiting for npm propagation... attempt $i/60"
            sleep 10
          done

          echo "::error::Package not available after 10 minutes"
          exit 1

  update-homebrew:
    needs: [prepare, publish-npm]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'push' || inputs.update_homebrew == true) && needs.publish-npm.outputs.sha256 != '' }}
    steps:
      - name: Checkout homebrew-viben
        uses: actions/checkout@v6
        with:
          repository: LinXueyuanStdio/homebrew-viben
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-viben
        continue-on-error: true

      - name: Check if tap exists
        id: check-tap
        run: |
          if [ -d "homebrew-viben" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::warning::Homebrew tap repository not found. Skipping formula update."
          fi

      - name: Update formula
        if: steps.check-tap.outputs.exists == 'true'
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          SHA256="${{ needs.publish-npm.outputs.sha256 }}"

          cd homebrew-viben

          # Create Formula directory if it doesn't exist
          mkdir -p Formula

          # Generate the formula
          cat > Formula/viben.rb << 'EOF'
          class Viben < Formula
            desc "Orchestrate AI agent clusters in your local workspace"
            homepage "https://github.com/LinXueyuanStdio/viben"
            url "https://registry.npmjs.org/viben/-/viben-VERSION_PLACEHOLDER.tgz"
            sha256 "SHA256_PLACEHOLDER"
            license "MIT"

            depends_on "node@20"

            def install
              system "npm", "install", *std_npm_args
              bin.install_symlink Dir["#{libexec}/bin/*"]
            end

            test do
              assert_match "Viben CLI", shell_output("#{bin}/viben --help")
            end
          end
          EOF

          # Replace placeholders
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" Formula/viben.rb
          sed -i "s/SHA256_PLACEHOLDER/${SHA256}/g" Formula/viben.rb

          echo "Updated formula:"
          cat Formula/viben.rb

      - name: Commit and push
        if: steps.check-tap.outputs.exists == 'true'
        run: |
          cd homebrew-viben
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/viben.rb
          git diff --cached --quiet || git commit -m "Update viben to ${{ needs.prepare.outputs.version }}"
          git push
