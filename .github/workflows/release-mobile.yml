name: Release Mobile App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.1). Leave empty to use version from tauri.conf.json'
        required: false
        type: string
      draft:
        description: 'Create as draft release'
        type: boolean
        default: true
      target:
        description: 'Build target'
        type: choice
        options:
          - both
          - android
          - ios
        default: both
      skip_tests:
        description: 'Skip mobile tests (faster release)'
        type: boolean
        default: false
  push:
    tags:
      - 'mobile-v*'

# Ensure only one release workflow runs at a time
concurrency:
  group: release-mobile-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  # =============================================================================
  # PREPARE: Determine the version to release
  # =============================================================================
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-version.outputs.tag }}
      is_draft: ${{ steps.get-version.outputs.is_draft }}
      build_android: ${{ steps.get-version.outputs.build_android }}
      build_ios: ${{ steps.get-version.outputs.build_ios }}
      skip_tests: ${{ steps.get-version.outputs.skip_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get version
        id: get-version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -n "${{ inputs.version }}" ]]; then
              VERSION="${{ inputs.version }}"
            else
              VERSION=$(jq -r '.version' apps/desktop/src-tauri/tauri.conf.json)
            fi
            IS_DRAFT="${{ inputs.draft }}"
            TARGET="${{ inputs.target }}"
            SKIP_TESTS="${{ inputs.skip_tests }}"
          else
            # Tag trigger - extract version from tag (mobile-v0.1.0 -> 0.1.0)
            VERSION="${GITHUB_REF_NAME#mobile-v}"
            IS_DRAFT="false"
            TARGET="both"
            SKIP_TESTS="false"
          fi

          BUILD_ANDROID="false"
          BUILD_IOS="false"
          if [[ "$TARGET" == "both" || "$TARGET" == "android" ]]; then
            BUILD_ANDROID="true"
          fi
          if [[ "$TARGET" == "both" || "$TARGET" == "ios" ]]; then
            BUILD_IOS="true"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=mobile-v${VERSION}" >> $GITHUB_OUTPUT
          echo "is_draft=${IS_DRAFT}" >> $GITHUB_OUTPUT
          echo "build_android=${BUILD_ANDROID}" >> $GITHUB_OUTPUT
          echo "build_ios=${BUILD_IOS}" >> $GITHUB_OUTPUT
          echo "skip_tests=${SKIP_TESTS}" >> $GITHUB_OUTPUT
          echo "=========================================="
          echo "Release Configuration:"
          echo "  Version: ${VERSION}"
          echo "  Tag: mobile-v${VERSION}"
          echo "  Build Android: ${BUILD_ANDROID}"
          echo "  Build iOS: ${BUILD_IOS}"
          echo "  Skip Tests: ${SKIP_TESTS}"
          echo "  Draft: ${IS_DRAFT}"
          echo "=========================================="

  # =============================================================================
  # BUILD ANDROID: Build Android APK/AAB
  # =============================================================================
  build-android:
    needs: prepare
    if: needs.prepare.outputs.build_android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          token: ${{ secrets.GH_PAT }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Set Android environment variables
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'
          shared-key: android

      - name: Build workspace packages
        run: pnpm turbo build --filter=@viben/desktop^...

      - name: Sync version
        shell: bash
        run: ./scripts/sync-version.sh "${{ needs.prepare.outputs.version }}"

      - name: Initialize Android project
        working-directory: apps/desktop
        run: pnpm tauri android init --ci

      - name: Setup Android signing
        run: |
          cd apps/desktop/src-tauri/gen/android
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" > $RUNNER_TEMP/keystore.jks
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties
          echo "Android signing configured"

      - name: Build Android APK (signed)
        working-directory: apps/desktop
        run: pnpm tauri android build --apk true --ci

      - name: Collect Android artifacts
        run: |
          mkdir -p android-artifacts
          find apps/desktop/src-tauri/gen/android -name "*.apk" -exec cp {} android-artifacts/ \;
          find apps/desktop/src-tauri/gen/android -name "*.aab" -exec cp {} android-artifacts/ \; 2>/dev/null || true
          echo "Collected artifacts:"
          ls -la android-artifacts/

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: android-artifacts/*
          retention-days: 1

  # =============================================================================
  # TEST ANDROID: Install and test APK on emulator
  # =============================================================================
  test-android:
    needs: [prepare, build-android]
    if: |
      needs.prepare.outputs.build_android == 'true' &&
      needs.prepare.outputs.skip_tests != 'true' &&
      needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: test-apk

      - name: Find APK file
        id: find-apk
        run: |
          APK_FILE=$(find test-apk -name "*.apk" -type f | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "No APK found!"
            exit 1
          fi
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_FILE"
          ls -la "$APK_FILE"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # Verify KVM is available
          ls -la /dev/kvm || true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install additional Android SDK components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-30" "emulator"
          sdkmanager --list | head -50

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          # Verify Maestro installation
          $HOME/.maestro/bin/maestro --version

      - name: Create test directories
        run: |
          mkdir -p test-screenshots
          mkdir -p test-screenshots/maestro
          mkdir -p test-logs

      - name: Run comprehensive tests on emulator
        id: run-tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          heap-size: 512M
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -x
            echo "=========================================="
            echo "Step 1: Emulator Verification"
            echo "=========================================="
            adb devices
            adb shell getprop ro.product.model
            adb shell getprop ro.build.version.release
            adb shell wm size

            echo "=========================================="
            echo "Step 2: APK Installation"
            echo "=========================================="
            # Uninstall previous version if exists
            adb uninstall com.viben.desktop || true

            # Install APK
            adb install -r "${{ steps.find-apk.outputs.apk_path }}"

            # Verify installation
            adb shell pm list packages | grep com.viben.desktop
            adb shell dumpsys package com.viben.desktop | grep versionName || true

            echo "=========================================="
            echo "Step 3: App Launch"
            echo "=========================================="
            # Launch app
            adb shell am start -n com.viben.desktop/.MainActivity || \
              adb shell monkey -p com.viben.desktop -c android.intent.category.LAUNCHER 1

            # Wait for app to fully load
            echo "Waiting for app to load..."
            sleep 12

            # Verify app is running
            adb shell pidof com.viben.desktop && echo "App is running!" || echo "Warning: App process not found"

            # Screenshot: Initial state
            adb exec-out screencap -p > test-screenshots/01-app-launched.png

            echo "=========================================="
            echo "Step 4: UI Verification"
            echo "=========================================="
            # Dump UI hierarchy for verification
            adb shell uiautomator dump /dev/tty 2>/dev/null | head -100 || true

            # Check for key UI elements
            if adb shell uiautomator dump /dev/tty 2>/dev/null | grep -qi "Viben"; then
              echo "PASS: App header 'Viben' found"
            else
              echo "WARN: App header not found in UI dump"
            fi

            echo "=========================================="
            echo "Step 5: Tab Navigation Testing"
            echo "=========================================="
            # Get screen dimensions for tap coordinates
            SCREEN_SIZE=$(adb shell wm size | grep -oE '[0-9]+x[0-9]+')
            SCREEN_WIDTH=$(echo $SCREEN_SIZE | cut -d'x' -f1)
            SCREEN_HEIGHT=$(echo $SCREEN_SIZE | cut -d'x' -f2)
            echo "Screen: ${SCREEN_WIDTH}x${SCREEN_HEIGHT}"

            # Calculate tab positions (bottom navigation)
            TAB_Y=$((SCREEN_HEIGHT - 50))
            TAB_WIDTH=$((SCREEN_WIDTH / 3))
            DEVICES_X=$((TAB_WIDTH / 2))
            CONNECT_X=$((TAB_WIDTH + TAB_WIDTH / 2))
            CHAT_X=$((TAB_WIDTH * 2 + TAB_WIDTH / 2))

            # Navigate to Devices tab
            echo "Tapping Devices tab at ($DEVICES_X, $TAB_Y)"
            adb shell input tap $DEVICES_X $TAB_Y
            sleep 2
            adb exec-out screencap -p > test-screenshots/02-devices-tab.png

            # Navigate to Connect tab
            echo "Tapping Connect tab at ($CONNECT_X, $TAB_Y)"
            adb shell input tap $CONNECT_X $TAB_Y
            sleep 2
            adb exec-out screencap -p > test-screenshots/03-connect-tab.png

            # Navigate to Chat tab
            echo "Tapping Chat tab at ($CHAT_X, $TAB_Y)"
            adb shell input tap $CHAT_X $TAB_Y
            sleep 2
            adb exec-out screencap -p > test-screenshots/04-chat-tab.png

            echo "=========================================="
            echo "Step 6: Dialog Interaction"
            echo "=========================================="
            # Go back to Connect tab
            adb shell input tap $CONNECT_X $TAB_Y
            sleep 2

            # Try to tap "Enter URL manually" button (approximate position)
            BUTTON_X=$((SCREEN_WIDTH / 2))
            BUTTON_Y=$((SCREEN_HEIGHT / 2 + 100))
            echo "Tapping URL button at ($BUTTON_X, $BUTTON_Y)"
            adb shell input tap $BUTTON_X $BUTTON_Y
            sleep 2
            adb exec-out screencap -p > test-screenshots/05-url-dialog.png

            # Enter test URL
            adb shell input tap $BUTTON_X $((SCREEN_HEIGHT / 2))
            sleep 1
            adb shell input text "http://192.168.1.100:18790"
            sleep 1
            adb exec-out screencap -p > test-screenshots/06-url-entered.png

            # Press back to close dialog
            adb shell input keyevent KEYCODE_BACK
            sleep 1
            adb exec-out screencap -p > test-screenshots/07-dialog-closed.png

            echo "=========================================="
            echo "Step 7: Gesture Testing"
            echo "=========================================="
            # Pull-to-refresh
            CENTER_X=$((SCREEN_WIDTH / 2))
            adb shell input swipe $CENTER_X 200 $CENTER_X 600 300
            sleep 2
            adb exec-out screencap -p > test-screenshots/08-after-swipe.png

            echo "=========================================="
            echo "Step 8: App Lifecycle Test"
            echo "=========================================="
            # Background app
            adb shell input keyevent KEYCODE_HOME
            sleep 2

            # Resume app
            adb shell am start -n com.viben.desktop/.MainActivity || \
              adb shell monkey -p com.viben.desktop -c android.intent.category.LAUNCHER 1
            sleep 3
            adb exec-out screencap -p > test-screenshots/09-app-resumed.png

            # Check app is still running
            if adb shell pidof com.viben.desktop > /dev/null 2>&1; then
              echo "PASS: App resumed successfully"
            else
              echo "FAIL: App crashed during resume"
            fi

            echo "=========================================="
            echo "Step 9: Stability Test (Rapid Navigation)"
            echo "=========================================="
            for i in 1 2 3; do
              adb shell input tap $DEVICES_X $TAB_Y
              sleep 0.5
              adb shell input tap $CONNECT_X $TAB_Y
              sleep 0.5
              adb shell input tap $CHAT_X $TAB_Y
              sleep 0.5
            done
            sleep 2
            adb exec-out screencap -p > test-screenshots/10-stability-test.png

            # Final state check
            if adb shell pidof com.viben.desktop > /dev/null 2>&1; then
              echo "PASS: App stable after rapid navigation"
            else
              echo "FAIL: App crashed during stability test"
            fi

            echo "=========================================="
            echo "Step 10: Maestro UI Automation Tests"
            echo "=========================================="
            # Run Maestro tests
            maestro test apps/desktop/.maestro/smoke-test.yaml \
              --format junit \
              --output maestro-results.xml \
              --debug-output test-screenshots/maestro \
              2>&1 || true

            echo "=========================================="
            echo "Step 11: Collecting Diagnostics"
            echo "=========================================="
            # Collect logs
            adb logcat -d > test-logs/logcat-full.txt || true
            adb logcat -d | grep -i com.viben.desktop > test-logs/logcat-app.txt || true

            # Check for crashes
            if adb logcat -d | grep -i "FATAL EXCEPTION" | grep -i com.viben.desktop; then
              echo "ERROR: App crash detected!"
              adb logcat -d | grep -A 50 "FATAL EXCEPTION" > test-logs/crash-log.txt || true
            else
              echo "No crashes detected"
            fi

            # Memory info
            adb shell dumpsys meminfo com.viben.desktop > test-logs/meminfo.txt 2>/dev/null || true

            # Final screenshot
            adb exec-out screencap -p > test-screenshots/11-final-state.png

            echo "=========================================="
            echo "Test Run Complete!"
            echo "=========================================="
            ls -la test-screenshots/
            ls -la test-logs/

      - name: Process Maestro results
        if: always()
        run: |
          echo "=========================================="
          echo "Maestro Test Results"
          echo "=========================================="
          if [ -f maestro-results.xml ]; then
            echo "Maestro JUnit report:"
            cat maestro-results.xml
            echo ""

            # Extract test summary
            TESTS=$(grep -oP 'tests="\K[0-9]+' maestro-results.xml || echo "0")
            FAILURES=$(grep -oP 'failures="\K[0-9]+' maestro-results.xml || echo "0")
            ERRORS=$(grep -oP 'errors="\K[0-9]+' maestro-results.xml || echo "0")

            echo "Summary: $TESTS tests, $FAILURES failures, $ERRORS errors"

            if [ "$FAILURES" != "0" ] || [ "$ERRORS" != "0" ]; then
              echo "::warning::Maestro tests had $FAILURES failures and $ERRORS errors"
            fi
          else
            echo "No Maestro results file found"
          fi

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-screenshots
          path: test-screenshots/
          retention-days: 14

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-logs
          path: |
            test-logs/
            maestro-results.xml
          retention-days: 14

      - name: Upload Maestro debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-maestro-debug
          path: |
            ~/.maestro/tests/**/*
            test-screenshots/maestro/
          retention-days: 7
          if-no-files-found: ignore

      - name: Check test results and fail if needed
        if: always()
        run: |
          echo "=========================================="
          echo "Android Test Results Summary"
          echo "=========================================="

          FAILED=0

          # Check for screenshots
          SCREENSHOT_COUNT=$(ls -1 test-screenshots/*.png 2>/dev/null | wc -l)
          echo "Screenshots captured: $SCREENSHOT_COUNT"
          if [ "$SCREENSHOT_COUNT" -lt 5 ]; then
            echo "::warning::Only $SCREENSHOT_COUNT screenshots captured (expected at least 5)"
          fi

          # Check for crash logs
          if [ -f test-logs/crash-log.txt ]; then
            echo "::error::App crash detected during testing!"
            cat test-logs/crash-log.txt | head -50
            FAILED=1
          fi

          # Check Maestro results
          if [ -f maestro-results.xml ]; then
            FAILURES=$(grep -oP 'failures="\K[0-9]+' maestro-results.xml || echo "0")
            ERRORS=$(grep -oP 'errors="\K[0-9]+' maestro-results.xml || echo "0")
            if [ "$FAILURES" != "0" ] || [ "$ERRORS" != "0" ]; then
              echo "::warning::Maestro tests had issues: $FAILURES failures, $ERRORS errors"
              # Don't fail the build for Maestro issues as they can be flaky in CI
            fi
          fi

          # List all artifacts
          echo ""
          echo "Test artifacts:"
          echo "  Screenshots:"
          ls -la test-screenshots/*.png 2>/dev/null || echo "    (none)"
          echo "  Logs:"
          ls -la test-logs/*.txt 2>/dev/null || echo "    (none)"
          echo "  Maestro:"
          ls -la maestro-results.xml 2>/dev/null || echo "    (none)"

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "::error::Tests failed due to app crash"
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "All tests completed successfully!"
          echo "=========================================="

  # =============================================================================
  # RELEASE ANDROID: Upload Android artifacts to GitHub Release
  # =============================================================================
  release-android:
    needs: [prepare, build-android, test-android]
    # Run if build succeeded and (test succeeded OR test was skipped)
    if: |
      always() &&
      needs.prepare.outputs.build_android == 'true' &&
      needs.build-android.result == 'success' &&
      (needs.test-android.result == 'success' || needs.test-android.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: release-artifacts

      - name: List artifacts
        run: |
          echo "Release artifacts:"
          ls -la release-artifacts/

      - name: Upload Android artifacts to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: 'Viben Mobile v${{ needs.prepare.outputs.version }}'
          body: |
            ## Viben Mobile v${{ needs.prepare.outputs.version }}

            ### Installation

            #### Android
            - Download the `.apk` file
            - Enable "Install from unknown sources" in Settings if prompted
            - Open the APK to install

            ### Notes

            This is a lightweight mobile companion app for Viben.
            Connect to your desktop Viben instance by scanning the QR code.

            ### Checksums

            See `checksums.txt` attached to this release for SHA256 checksums.

            ### Changes

            See [CHANGELOG](https://github.com/LinXueyuanStdio/viben/blob/main/CHANGELOG.md) for details.
          draft: ${{ needs.prepare.outputs.is_draft == 'true' }}
          prerelease: false
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =============================================================================
  # BUILD IOS: Build iOS IPA
  # =============================================================================
  build-ios:
    needs: prepare
    if: needs.prepare.outputs.build_ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Cocoapods
        run: brew install cocoapods

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'
          shared-key: ios

      - name: Build workspace packages
        run: pnpm turbo build --filter=@viben/desktop^...

      - name: Sync version
        shell: bash
        run: ./scripts/sync-version.sh "${{ needs.prepare.outputs.version }}"

      - name: Initialize iOS project
        working-directory: apps/desktop
        run: pnpm tauri ios init --ci

      - name: Build iOS (unsigned, simulator)
        working-directory: apps/desktop
        run: pnpm tauri ios build --target aarch64-sim --ci

      - name: Collect iOS artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/ios-artifacts
          # Find and package .app bundle
          APP_PATH=$(find apps/desktop/src-tauri/gen/apple -name "*.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            APP_NAME=$(basename "$APP_PATH")
            cd "$(dirname "$APP_PATH")"
            zip -r "$GITHUB_WORKSPACE/ios-artifacts/${APP_NAME%.app}-simulator.zip" "$APP_NAME"
            cd "$GITHUB_WORKSPACE"
          fi
          # Copy any IPA files
          find apps/desktop/src-tauri/gen/apple -name "*.ipa" -exec cp {} $GITHUB_WORKSPACE/ios-artifacts/ \; 2>/dev/null || true
          echo "Collected artifacts:"
          ls -la $GITHUB_WORKSPACE/ios-artifacts/

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: ios-artifacts/*
          retention-days: 1

  # =============================================================================
  # TEST IOS: Test iOS app on simulator
  # =============================================================================
  test-ios:
    needs: [prepare, build-ios]
    if: |
      needs.prepare.outputs.build_ios == 'true' &&
      needs.prepare.outputs.skip_tests != 'true' &&
      needs.build-ios.result == 'success'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-artifacts
          path: test-ios

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: List available simulators
        run: |
          echo "Available iOS Simulators:"
          xcrun simctl list devices available
          echo ""
          echo "Available Runtimes:"
          xcrun simctl list runtimes

      - name: Boot iOS Simulator
        id: boot-simulator
        run: |
          # Find an available iPhone simulator (prefer iPhone 15/16)
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 15" | grep -oE '\([A-F0-9-]+\)' | head -1 | tr -d '()')

          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone 14" | grep -oE '\([A-F0-9-]+\)' | head -1 | tr -d '()')
          fi

          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | grep -oE '\([A-F0-9-]+\)' | tr -d '()')
          fi

          if [ -z "$DEVICE_ID" ]; then
            echo "No iPhone simulator found, creating one..."
            # Get latest iOS runtime
            LATEST_RUNTIME=$(xcrun simctl list runtimes | grep -i "iOS" | tail -1 | grep -oE 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]+')
            DEVICE_ID=$(xcrun simctl create "Test iPhone" "iPhone 15" "$LATEST_RUNTIME" 2>/dev/null || \
                       xcrun simctl create "Test iPhone" "iPhone 14" "$LATEST_RUNTIME" 2>/dev/null)
          fi

          if [ -z "$DEVICE_ID" ]; then
            echo "Error: Failed to find or create simulator"
            exit 1
          fi

          DEVICE_NAME=$(xcrun simctl list devices | grep "$DEVICE_ID" | sed 's/ (.*//' | xargs)
          echo "Using simulator: $DEVICE_NAME ($DEVICE_ID)"
          echo "SIMULATOR_ID=$DEVICE_ID" >> $GITHUB_ENV
          echo "SIMULATOR_NAME=$DEVICE_NAME" >> $GITHUB_ENV

          # Boot the simulator
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true

          # Wait for boot to complete
          echo "Waiting for simulator to boot..."
          sleep 10

          # Verify boot status
          if xcrun simctl list devices | grep "$DEVICE_ID" | grep -q "(Booted)"; then
            echo "Simulator booted successfully"
          else
            echo "Warning: Simulator boot status unclear"
          fi

      - name: Extract and identify app
        id: extract-app
        run: |
          echo "Extracting app..."
          cd test-ios
          unzip -o *.zip || true

          APP_PATH=$(find . -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found!"
            ls -la
            exit 1
          fi
          echo "Found app: $APP_PATH"

          # Get app info
          BUNDLE_ID=$(defaults read "$APP_PATH/Info.plist" CFBundleIdentifier 2>/dev/null || echo "com.viben.desktop")
          APP_VERSION=$(defaults read "$APP_PATH/Info.plist" CFBundleShortVersionString 2>/dev/null || echo "unknown")

          echo "Bundle ID: $BUNDLE_ID"
          echo "App Version: $APP_VERSION"

          echo "APP_PATH=$(pwd)/$APP_PATH" >> $GITHUB_ENV
          echo "BUNDLE_ID=$BUNDLE_ID" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

      - name: Install app on simulator
        run: |
          echo "Removing any existing installation..."
          xcrun simctl uninstall "$SIMULATOR_ID" "$BUNDLE_ID" 2>/dev/null || true

          echo "Installing app on simulator..."
          xcrun simctl install "$SIMULATOR_ID" "$APP_PATH"
          echo "App installed successfully"

      - name: Launch and verify app
        run: |
          echo "Launching app..."
          xcrun simctl launch "$SIMULATOR_ID" "$BUNDLE_ID"

          echo "Waiting for app to initialize..."
          sleep 15

          echo "Taking initial screenshot..."
          xcrun simctl io "$SIMULATOR_ID" screenshot ios-screenshot-01-launched.png || true

          # Verify app is running
          if xcrun simctl spawn "$SIMULATOR_ID" launchctl list 2>/dev/null | grep -q "$BUNDLE_ID"; then
            echo "App is running"
          else
            echo "Warning: Could not verify app process, but continuing..."
          fi

      - name: Test app lifecycle
        run: |
          echo "Testing app lifecycle..."

          # Terminate and relaunch to test lifecycle
          echo "Terminating app..."
          xcrun simctl terminate "$SIMULATOR_ID" "$BUNDLE_ID" 2>/dev/null || true
          sleep 2

          echo "Relaunching app..."
          xcrun simctl launch "$SIMULATOR_ID" "$BUNDLE_ID"
          sleep 5

          echo "Taking screenshot after relaunch..."
          xcrun simctl io "$SIMULATOR_ID" screenshot ios-screenshot-02-relaunched.png || true

          # Test deep link handling
          echo "Testing deep link..."
          xcrun simctl openurl "$SIMULATOR_ID" "viben://test" 2>/dev/null || true
          sleep 2
          xcrun simctl io "$SIMULATOR_ID" screenshot ios-screenshot-03-deeplink.png || true

      - name: Run Maestro smoke test
        run: |
          echo "Running Maestro iOS smoke test..."

          # Try iOS-specific test first, then fall back to generic
          if [ -f apps/desktop/.maestro/ios-smoke-test.yaml ]; then
            maestro test apps/desktop/.maestro/ios-smoke-test.yaml \
              --format junit \
              --output maestro-ios-results.xml || true
          elif [ -f apps/desktop/.maestro/smoke-test.yaml ]; then
            maestro test apps/desktop/.maestro/smoke-test.yaml \
              --format junit \
              --output maestro-ios-results.xml || true
          else
            echo "No Maestro test files found, skipping..."
          fi

      - name: Collect app logs
        if: always()
        run: |
          echo "Collecting simulator logs..."
          xcrun simctl spawn "$SIMULATOR_ID" log show \
            --predicate "subsystem CONTAINS '$BUNDLE_ID' OR process CONTAINS 'viben'" \
            --last 10m \
            --style compact > ios-app-logs.txt 2>/dev/null || true

          # Check for crash logs
          CRASH_LOG=$(find ~/Library/Logs/DiagnosticReports -name "*viben*" -o -name "*Viben*" -mmin -30 2>/dev/null | head -1)
          if [ -n "$CRASH_LOG" ]; then
            echo "Warning: Crash log found!"
            cp "$CRASH_LOG" ios-crash-log.txt 2>/dev/null || true
          fi

          # Take final screenshot
          xcrun simctl io "$SIMULATOR_ID" screenshot ios-screenshot-final.png || true

      - name: Shutdown simulator
        if: always()
        run: |
          echo "Shutting down simulator..."
          xcrun simctl shutdown "$SIMULATOR_ID" 2>/dev/null || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            ios-screenshot*.png
            maestro-ios-results.xml
            ios-app-logs.txt
            ios-crash-log.txt
            ~/.maestro/tests/**/*
          retention-days: 7

      - name: Check test results
        if: always()
        run: |
          echo "=========================================="
          echo "iOS Test Results Summary"
          echo "=========================================="
          echo "Simulator: $SIMULATOR_NAME"
          echo "App Version: $APP_VERSION"
          echo "Bundle ID: $BUNDLE_ID"
          echo ""

          # Check for crash logs
          if [ -f ios-crash-log.txt ]; then
            echo "WARNING: App crash detected!"
            echo "See ios-crash-log.txt for details"
            echo ""
          fi

          # Check Maestro results
          if [ -f maestro-ios-results.xml ]; then
            echo "Maestro Test Results:"
            # Extract test counts from JUnit XML
            TESTS=$(grep -o 'tests="[0-9]*"' maestro-ios-results.xml | head -1 | grep -o '[0-9]*')
            FAILURES=$(grep -o 'failures="[0-9]*"' maestro-ios-results.xml | head -1 | grep -o '[0-9]*')
            ERRORS=$(grep -o 'errors="[0-9]*"' maestro-ios-results.xml | head -1 | grep -o '[0-9]*')
            echo "  Tests: ${TESTS:-0}"
            echo "  Failures: ${FAILURES:-0}"
            echo "  Errors: ${ERRORS:-0}"
            echo ""
          fi

          # List screenshots
          echo "Screenshots captured:"
          ls -la ios-screenshot*.png 2>/dev/null || echo "  None"
          echo ""

          echo "=========================================="

  # =============================================================================
  # RELEASE IOS: Upload iOS artifacts to GitHub Release
  # =============================================================================
  release-ios:
    needs: [prepare, build-ios, test-ios]
    # Run if build succeeded and (test succeeded OR test was skipped)
    if: |
      always() &&
      needs.prepare.outputs.build_ios == 'true' &&
      needs.build-ios.result == 'success' &&
      (needs.test-ios.result == 'success' || needs.test-ios.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-artifacts
          path: release-artifacts

      - name: List artifacts
        run: |
          echo "Release artifacts:"
          ls -la release-artifacts/

      - name: Upload iOS artifacts to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: 'Viben Mobile v${{ needs.prepare.outputs.version }}'
          draft: ${{ needs.prepare.outputs.is_draft == 'true' }}
          prerelease: false
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =============================================================================
  # CHECKSUMS: Generate checksums after all releases complete
  # =============================================================================
  checksums:
    needs: [prepare, release-android, release-ios]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      (needs.release-android.result == 'success' || needs.release-android.result == 'skipped') &&
      (needs.release-ios.result == 'success' || needs.release-ios.result == 'skipped') &&
      (needs.release-android.result == 'success' || needs.release-ios.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Publish draft release
        if: needs.prepare.outputs.is_draft == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
        run: |
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases | \
            jq -r --arg tag "$TAG_NAME" '.[] | select(.tag_name == $tag and .draft == true) | .id')

          if [ -n "$RELEASE_ID" ]; then
            echo "Publishing draft release ID: $RELEASE_ID"
            gh api -X PATCH repos/${{ github.repository }}/releases/$RELEASE_ID \
              -f draft=false
            echo "Release published successfully"
            sleep 5
          else
            echo "No draft release found with tag $TAG_NAME"
            gh release view "$TAG_NAME" || echo "Release not found"
          fi

      - name: Download release assets
        uses: robinraju/release-downloader@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          fileName: '*'
          out-file-path: 'release-assets'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt || true
          echo "Generated checksums:"
          cat checksums.txt

      - name: Upload checksums to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: release-assets/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
