# Dependency Review Workflow
#
# This workflow scans pull requests for dependency changes and:
# - Detects known vulnerabilities in new/updated dependencies
# - Enforces license compliance (blocks GPL/AGPL, allows permissive licenses)
# - Posts a summary comment on the PR with findings
#
# Supported lockfiles in this monorepo:
# - pnpm-lock.yaml (JavaScript/TypeScript)
# - Cargo.lock (Rust/Tauri)
# - poetry.lock (Python)

name: Dependency Review

on:
  pull_request:
    paths:
      - "pnpm-lock.yaml"
      - "**/Cargo.lock"
      - "**/poetry.lock"
      - "**/package.json"

# Cancel in-progress runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Fail on high and critical severity vulnerabilities
          fail-on-severity: high

          # License compliance - deny copyleft licenses
          # Note: Cannot use both allow-licenses and deny-licenses simultaneously
          # Using deny-licenses for a blocklist approach (more permissive)
          deny-licenses: GPL-3.0, AGPL-3.0, GPL-2.0, LGPL-3.0, LGPL-2.1

          # Always post a summary comment on the PR
          comment-summary-in-pr: always
