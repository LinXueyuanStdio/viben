name: Release Desktop App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.1). Leave empty to use version from tauri.conf.json'
        required: false
        type: string
      draft:
        description: 'Create as draft release'
        type: boolean
        default: true
  push:
    tags:
      - 'desktop-v*'

# Ensure only one release workflow runs at a time
concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  # Determine the version to release
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-version.outputs.tag }}
      is_draft: ${{ steps.get-version.outputs.is_draft }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get version
        id: get-version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual trigger
            if [[ -n "${{ inputs.version }}" ]]; then
              VERSION="${{ inputs.version }}"
            else
              VERSION=$(jq -r '.version' apps/desktop/src-tauri/tauri.conf.json)
            fi
            IS_DRAFT="${{ inputs.draft }}"
          else
            # Tag trigger - extract version from tag (desktop-v0.1.0 -> 0.1.0)
            VERSION="${GITHUB_REF_NAME#desktop-v}"
            IS_DRAFT="false"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=desktop-v${VERSION}" >> $GITHUB_OUTPUT
          echo "is_draft=${IS_DRAFT}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

  # Build for all platforms
  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            args: ''
            rust_targets: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'
          shared-key: ${{ matrix.platform }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm turbo build --filter=@viben/desktop^...

      - name: Update version in tauri.conf.json
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          cd apps/desktop/src-tauri
          # Use a temp file to avoid issues with in-place editing
          jq --arg v "$VERSION" '.version = $v' tauri.conf.json > tauri.conf.tmp.json
          mv tauri.conf.tmp.json tauri.conf.json
          echo "Updated version to: $(jq -r '.version' tauri.conf.json)"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Note: macOS and Windows code signing disabled
          # Users can install unsigned apps by right-clicking and selecting "Open"
          # To enable signing later, add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, etc.
        with:
          projectPath: apps/desktop
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: 'Viben Desktop v${{ needs.prepare.outputs.version }}'
          releaseBody: |
            ## Viben Desktop v${{ needs.prepare.outputs.version }}

            ### Installation

            - **macOS**: Download the `.dmg` file and drag Viben to Applications
              - ⚠️ First launch: Right-click the app → "Open" → "Open" (to bypass Gatekeeper)
              - Or run: `xattr -cr /Applications/Viben.app` or `xattr -d com.apple.quarantine /Applications/Viben.app`
            - **Windows**: Download the `.msi` or `.exe` installer and run it
            - **Linux**: Download `.AppImage` (portable) or `.deb` (Debian/Ubuntu)

            ### Checksums

            See `checksums.txt` attached to this release for SHA256 checksums.

            ### Changes

            See [CHANGELOG](https://github.com/LinXueyuanStdio/viben/blob/main/CHANGELOG.md) for details.
          releaseDraft: ${{ needs.prepare.outputs.is_draft == 'true' }}
          prerelease: false
          args: ${{ matrix.args }}

      - name: Remove macOS signature artifacts (unsigned build)
        if: matrix.platform == 'macos-latest'
        run: |
          # For unsigned builds, remove any .sig files that might cause confusion
          find apps/desktop/src-tauri/target -name "*.sig" -delete 2>/dev/null || true

  # Generate checksums after all builds complete
  checksums:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Publish draft release
        if: needs.prepare.outputs.is_draft == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
        run: |
          # Get the release ID for the draft release
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases | \
            jq -r --arg tag "$TAG_NAME" '.[] | select(.tag_name == $tag and .draft == true) | .id')

          if [ -n "$RELEASE_ID" ]; then
            echo "Publishing draft release ID: $RELEASE_ID"
            gh api -X PATCH repos/${{ github.repository }}/releases/$RELEASE_ID \
              -f draft=false
            echo "Release published successfully"
            # Wait for GitHub API to propagate the release state change
            # This ensures the release is accessible via tag in the next step
            sleep 5
          else
            echo "No draft release found with tag $TAG_NAME"
            echo "Checking if a published release already exists..."
            gh release view "$TAG_NAME" || echo "Release not found"
          fi

      - name: Download release assets
        uses: robinraju/release-downloader@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          fileName: '*'
          out-file-path: 'release-assets'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate checksums
        run: |
          cd release-assets
          # Generate SHA256 checksums for all files
          sha256sum * > checksums.txt || true
          echo "Generated checksums:"
          cat checksums.txt

      - name: Upload checksums to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: release-assets/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate desktop-releases.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
        run: |
          # Get release assets from GitHub API
          RELEASE_DATA=$(gh api repos/${{ github.repository }}/releases/tags/$TAG_NAME)

          # Extract asset URLs by pattern
          ASSETS=$(echo "$RELEASE_DATA" | jq -r '.assets')

          # Find URLs for each platform
          DMG_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".dmg")) | .browser_download_url' | head -1)
          MSI_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".msi")) | .browser_download_url' | head -1)
          EXE_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith("-setup.exe")) | .browser_download_url' | head -1)
          APPIMAGE_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".AppImage")) | .browser_download_url' | head -1)
          DEB_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".deb")) | .browser_download_url' | head -1)

          # Get file names
          DMG_NAME=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".dmg")) | .name' | head -1)
          MSI_NAME=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".msi")) | .name' | head -1)
          EXE_NAME=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith("-setup.exe")) | .name' | head -1)
          APPIMAGE_NAME=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".AppImage")) | .name' | head -1)
          DEB_NAME=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".deb")) | .name' | head -1)

          # Create JSON file
          cat > release-assets/desktop-releases.json << EOF
          {
            "version": "${VERSION}",
            "tag": "${TAG_NAME}",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "repository": "${{ github.repository }}",
            "assets": {
              "macos": {
                "dmg": {
                  "url": "${DMG_URL}",
                  "name": "${DMG_NAME}"
                }
              },
              "windows": {
                "msi": {
                  "url": "${MSI_URL}",
                  "name": "${MSI_NAME}"
                },
                "exe": {
                  "url": "${EXE_URL}",
                  "name": "${EXE_NAME}"
                }
              },
              "linux": {
                "appimage": {
                  "url": "${APPIMAGE_URL}",
                  "name": "${APPIMAGE_NAME}"
                },
                "deb": {
                  "url": "${DEB_URL}",
                  "name": "${DEB_NAME}"
                }
              }
            }
          }
          EOF

          echo "Generated desktop-releases.json:"
          cat release-assets/desktop-releases.json

      - name: Upload releases JSON to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: release-assets/desktop-releases.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
