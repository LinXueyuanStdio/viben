name: Release Desktop App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.1). Leave empty to use version from tauri.conf.json'
        required: false
        type: string
      draft:
        description: 'Create as draft release'
        type: boolean
        default: true
  push:
    tags:
      - 'desktop-v*'

# Ensure only one release workflow runs at a time
concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  NODE_OPTIONS: --max-old-space-size=6144
  # Opt into Node.js 24 for GitHub Actions to avoid deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Determine the version to release
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-version.outputs.tag }}
      is_draft: ${{ steps.get-version.outputs.is_draft }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version
        id: get-version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual trigger
            if [[ -n "${{ inputs.version }}" ]]; then
              VERSION="${{ inputs.version }}"
            else
              VERSION=$(jq -r '.version' apps/desktop/src-tauri/tauri.conf.json)
            fi
            IS_DRAFT="${{ inputs.draft }}"
          else
            # Tag trigger - extract version from tag (desktop-v0.1.0 -> 0.1.0)
            VERSION="${GITHUB_REF_NAME#desktop-v}"
            IS_DRAFT="false"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=desktop-v${VERSION}" >> $GITHUB_OUTPUT
          echo "is_draft=${IS_DRAFT}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

  # Build for all platforms (includes sidecar build)
  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: builds both ARM64 and x64 via cross-compilation
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            args: ''
            rust_targets: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'
          shared-key: ${{ matrix.platform }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            libasound2-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @viben/core
        run: pnpm turbo build --filter=@viben/core

      - name: Build viben CLI
        run: pnpm turbo build --filter=viben

      # Build sidecar binaries
      - name: Build sidecar binary
        shell: bash
        run: |
          cd apps/cli
          echo "Building sidecar for current platform from apps/cli..."
          pnpm build:sidecar -- --platform current --skip-build

      # For macOS, also build x64 version (cross-compile from ARM64)
      - name: Build additional macOS sidecar (x64)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          cd apps/cli
          pnpm build:sidecar -- --platform macos-x64 --skip-build

      - name: Ad-hoc codesign sidecar binaries (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          for bin in apps/desktop/src-tauri/binaries/viben-*; do
            echo "Signing $bin..."
            codesign --remove-signature "$bin" 2>/dev/null || true
            codesign --entitlements apps/desktop/src-tauri/entitlements.plist --deep --sign - --force "$bin"
          done

      - name: List sidecar binaries
        shell: bash
        run: ls -la apps/desktop/src-tauri/binaries/

      - name: Prepare desktop bundled templates
        shell: bash
        run: |
          test -d apps/cli/dist/templates
          rm -rf apps/desktop/src-tauri/resources/templates
          mkdir -p apps/desktop/src-tauri/resources
          cp -R apps/cli/dist/templates apps/desktop/src-tauri/resources/templates

      - name: Build workspace packages
        run: pnpm turbo build --filter=@viben/desktop^...

      - name: Update version in tauri.conf.json
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          cd apps/desktop/src-tauri
          # Use a temp file to avoid issues with in-place editing
          jq --arg v "$VERSION" '.version = $v' tauri.conf.json > tauri.conf.tmp.json
          mv tauri.conf.tmp.json tauri.conf.json
          echo "Updated version to: $(jq -r '.version' tauri.conf.json)"

      # macOS: Build both ARM64 and x64 targets
      - name: Build Tauri app (macOS ARM64)
        if: matrix.platform == 'macos-latest'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: 'Viben Desktop v${{ needs.prepare.outputs.version }}'
          releaseBody: |
            ## Viben Desktop v${{ needs.prepare.outputs.version }}

            ### Installation

            #### macOS
            - **Apple Silicon (M1/M2/M3)**: Download the `aarch64` DMG file
            - **Intel**: Download the `x86_64` DMG file
            - Drag Viben to Applications
            - ⚠️ First launch: Right-click the app → "Open" → "Open" (to bypass Gatekeeper)
            - Or run: `sudo /usr/bin/xattr -cr /Applications/Viben.app`

            #### Windows
            Download the `.msi` or `.exe` installer and run it.

            #### Linux
            - **AppImage** (portable): Download and run `chmod +x` then execute
            - **Debian/Ubuntu**: Download `.deb` and install with `sudo dpkg -i`

            ### Features

            This release includes a bundled Viben CLI - no separate installation required!

            ### Checksums

            See `checksums.txt` attached to this release for SHA256 checksums.

            ### Changes

            See [CHANGELOG](https://github.com/LinXueyuanStdio/viben/blob/main/CHANGELOG.md) for details.
          releaseDraft: ${{ needs.prepare.outputs.is_draft == 'true' }}
          prerelease: false
          args: --target aarch64-apple-darwin

      - name: Build Tauri app (macOS x64)
        if: matrix.platform == 'macos-latest'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: 'Viben Desktop v${{ needs.prepare.outputs.version }}'
          releaseDraft: ${{ needs.prepare.outputs.is_draft == 'true' }}
          prerelease: false
          args: --target x86_64-apple-darwin

      # Windows/Linux: Build single target
      - name: Build Tauri app
        if: matrix.platform != 'macos-latest'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: 'Viben Desktop v${{ needs.prepare.outputs.version }}'
          releaseBody: |
            ## Viben Desktop v${{ needs.prepare.outputs.version }}

            ### Installation

            #### macOS
            - **Apple Silicon (M1/M2/M3)**: Download the `aarch64` DMG file
            - **Intel**: Download the `x86_64` DMG file
            - Drag Viben to Applications
            - ⚠️ First launch: Right-click the app → "Open" → "Open" (to bypass Gatekeeper)
            - Or run: `sudo /usr/bin/xattr -cr /Applications/Viben.app`

            #### Windows
            Download the `.msi` or `.exe` installer and run it.

            #### Linux
            - **AppImage** (portable): Download and run `chmod +x` then execute
            - **Debian/Ubuntu**: Download `.deb` and install with `sudo dpkg -i`

            ### Features

            This release includes a bundled Viben CLI - no separate installation required!

            ### Checksums

            See `checksums.txt` attached to this release for SHA256 checksums.

            ### Changes

            See [CHANGELOG](https://github.com/LinXueyuanStdio/viben/blob/main/CHANGELOG.md) for details.
          releaseDraft: ${{ needs.prepare.outputs.is_draft == 'true' }}
          prerelease: false
          args: ${{ matrix.args }}

      - name: Remove macOS signature artifacts (unsigned build)
        if: matrix.platform == 'macos-latest'
        run: |
          # For unsigned builds, remove any .sig files that might cause confusion
          find apps/desktop/src-tauri/target -name "*.sig" -delete 2>/dev/null || true

  # Generate checksums after all builds complete
  checksums:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Publish draft release
        if: needs.prepare.outputs.is_draft == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
        run: |
          # Get the release ID for the draft release
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases | \
            jq -r --arg tag "$TAG_NAME" '.[] | select(.tag_name == $tag and .draft == true) | .id')

          if [ -n "$RELEASE_ID" ]; then
            echo "Publishing draft release ID: $RELEASE_ID"
            gh api -X PATCH repos/${{ github.repository }}/releases/$RELEASE_ID \
              -f draft=false
            echo "Release published successfully"
            # Wait for GitHub API to propagate the release state change
            # This ensures the release is accessible via tag in the next step
            sleep 5
          else
            echo "No draft release found with tag $TAG_NAME"
            echo "Checking if a published release already exists..."
            gh release view "$TAG_NAME" || echo "Release not found"
          fi

      - name: Download release assets
        uses: robinraju/release-downloader@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          fileName: '*'
          out-file-path: 'release-assets'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate checksums
        run: |
          cd release-assets
          # Generate SHA256 checksums for all files
          sha256sum * > checksums.txt || true
          echo "Generated checksums:"
          cat checksums.txt

      - name: Upload checksums to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: release-assets/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate desktop-releases.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
        run: |
          # Get release assets from GitHub API
          RELEASE_DATA=$(gh api repos/${{ github.repository }}/releases/tags/$TAG_NAME)

          # Extract asset URLs by pattern
          ASSETS=$(echo "$RELEASE_DATA" | jq -r '.assets')

          # Find URLs for each platform (macOS has two DMG files)
          DMG_ARM64_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".dmg")) | select(.name | contains("aarch64")) | .browser_download_url' | head -1)
          DMG_X64_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".dmg")) | select(.name | contains("x86_64") or contains("x64")) | .browser_download_url' | head -1)
          MSI_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".msi")) | .browser_download_url' | head -1)
          EXE_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith("-setup.exe")) | .browser_download_url' | head -1)
          APPIMAGE_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".AppImage")) | .browser_download_url' | head -1)
          DEB_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".deb")) | .browser_download_url' | head -1)

          # Get file names
          DMG_ARM64_NAME=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".dmg")) | select(.name | contains("aarch64")) | .name' | head -1)
          DMG_X64_NAME=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".dmg")) | select(.name | contains("x86_64") or contains("x64")) | .name' | head -1)
          MSI_NAME=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".msi")) | .name' | head -1)
          EXE_NAME=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith("-setup.exe")) | .name' | head -1)
          APPIMAGE_NAME=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".AppImage")) | .name' | head -1)
          DEB_NAME=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".deb")) | .name' | head -1)

          # Create JSON file
          cat > release-assets/desktop-releases.json << EOF
          {
            "version": "${VERSION}",
            "tag": "${TAG_NAME}",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "repository": "${{ github.repository }}",
            "assets": {
              "macos": {
                "arm64": {
                  "url": "${DMG_ARM64_URL}",
                  "name": "${DMG_ARM64_NAME}"
                },
                "x64": {
                  "url": "${DMG_X64_URL}",
                  "name": "${DMG_X64_NAME}"
                }
              },
              "windows": {
                "msi": {
                  "url": "${MSI_URL}",
                  "name": "${MSI_NAME}"
                },
                "exe": {
                  "url": "${EXE_URL}",
                  "name": "${EXE_NAME}"
                }
              },
              "linux": {
                "appimage": {
                  "url": "${APPIMAGE_URL}",
                  "name": "${APPIMAGE_NAME}"
                },
                "deb": {
                  "url": "${DEB_URL}",
                  "name": "${DEB_NAME}"
                }
              }
            }
          }
          EOF

          echo "Generated desktop-releases.json:"
          cat release-assets/desktop-releases.json

      - name: Upload releases JSON to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: release-assets/desktop-releases.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate latest.json for Tauri updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
        run: |
          # Get release info
          RELEASE_DATA=$(gh api repos/${{ github.repository }}/releases/tags/$TAG_NAME)
          PUB_DATE=$(echo "$RELEASE_DATA" | jq -r '.published_at')
          NOTES=$(echo "$RELEASE_DATA" | jq -r '.body // "See release notes on GitHub"')

          # Get assets
          ASSETS=$(echo "$RELEASE_DATA" | jq -r '.assets')

          # Find platform-specific updater artifacts (.tar.gz for macOS/Linux, .zip for Windows)
          # macOS ARM64
          MACOS_ARM64_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name | test("aarch64-apple-darwin.*\\.tar\\.gz$")) | .browser_download_url' | head -1)
          MACOS_ARM64_SIG=$(echo "$ASSETS" | jq -r '.[] | select(.name | test("aarch64-apple-darwin.*\\.tar\\.gz\\.sig$")) | .browser_download_url' | head -1)

          # macOS x64
          MACOS_X64_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name | test("x86_64-apple-darwin.*\\.tar\\.gz$")) | .browser_download_url' | head -1)
          MACOS_X64_SIG=$(echo "$ASSETS" | jq -r '.[] | select(.name | test("x86_64-apple-darwin.*\\.tar\\.gz\\.sig$")) | .browser_download_url' | head -1)

          # Windows x64
          WINDOWS_X64_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name | test("x86_64-pc-windows-msvc.*\\.zip$")) | .browser_download_url' | head -1)
          WINDOWS_X64_SIG=$(echo "$ASSETS" | jq -r '.[] | select(.name | test("x86_64-pc-windows-msvc.*\\.zip\\.sig$")) | .browser_download_url' | head -1)

          # Linux x64
          LINUX_X64_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name | test("x86_64-unknown-linux-gnu.*\\.tar\\.gz$")) | .browser_download_url' | head -1)
          LINUX_X64_SIG=$(echo "$ASSETS" | jq -r '.[] | select(.name | test("x86_64-unknown-linux-gnu.*\\.tar\\.gz\\.sig$")) | .browser_download_url' | head -1)

          # Helper function to get signature content or empty string
          get_sig() {
            local url=$1
            if [ -n "$url" ] && [ "$url" != "null" ]; then
              curl -sL "$url" 2>/dev/null || echo ""
            else
              echo ""
            fi
          }

          # Get signatures (if available - requires code signing setup)
          MACOS_ARM64_SIG_CONTENT=$(get_sig "$MACOS_ARM64_SIG")
          MACOS_X64_SIG_CONTENT=$(get_sig "$MACOS_X64_SIG")
          WINDOWS_X64_SIG_CONTENT=$(get_sig "$WINDOWS_X64_SIG")
          LINUX_X64_SIG_CONTENT=$(get_sig "$LINUX_X64_SIG")

          # Escape notes for JSON
          NOTES_ESCAPED=$(echo "$NOTES" | jq -Rs '.')

          # Build platforms object dynamically
          PLATFORMS="{}"

          # Add macOS ARM64 if available
          if [ -n "$MACOS_ARM64_URL" ] && [ "$MACOS_ARM64_URL" != "null" ]; then
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg url "$MACOS_ARM64_URL" --arg sig "$MACOS_ARM64_SIG_CONTENT" \
              '. + {"darwin-aarch64": {"url": $url, "signature": $sig}}')
          fi

          # Add macOS x64 if available
          if [ -n "$MACOS_X64_URL" ] && [ "$MACOS_X64_URL" != "null" ]; then
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg url "$MACOS_X64_URL" --arg sig "$MACOS_X64_SIG_CONTENT" \
              '. + {"darwin-x86_64": {"url": $url, "signature": $sig}}')
          fi

          # Add Windows x64 if available
          if [ -n "$WINDOWS_X64_URL" ] && [ "$WINDOWS_X64_URL" != "null" ]; then
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg url "$WINDOWS_X64_URL" --arg sig "$WINDOWS_X64_SIG_CONTENT" \
              '. + {"windows-x86_64": {"url": $url, "signature": $sig}}')
          fi

          # Add Linux x64 if available
          if [ -n "$LINUX_X64_URL" ] && [ "$LINUX_X64_URL" != "null" ]; then
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg url "$LINUX_X64_URL" --arg sig "$LINUX_X64_SIG_CONTENT" \
              '. + {"linux-x86_64": {"url": $url, "signature": $sig}}')
          fi

          # Create the final JSON
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$PUB_DATE" \
            --argjson notes "$NOTES_ESCAPED" \
            --argjson platforms "$PLATFORMS" \
            '{
              "version": $version,
              "pub_date": $pub_date,
              "notes": $notes,
              "platforms": $platforms
            }' > release-assets/latest.json

          echo "Generated latest.json:"
          cat release-assets/latest.json

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: release-assets/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
