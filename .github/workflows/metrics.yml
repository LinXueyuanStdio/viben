name: github-metrics

on:
  schedule:
    # Runs daily at 00:15 UTC; output is committed to ci-assets branch at assets/github-metrics.svg.
    - cron: '15 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/metrics.yml

permissions:
  contents: write

jobs:
  metrics:
    name: Generate repository metrics SVG
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub repository metrics
        uses: lowlighter/metrics@latest
        with:
          # Output path; the action commits to the ci-assets branch.
          filename: assets/github-metrics.svg

          # Auth: use the default GITHUB_TOKEN for simplicity.
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: ci-assets
          committer_message: 'chore: update ${filename}'
          output_action: commit
          output_condition: data-changed

          # Use the repository template (per-repo metrics, not user metrics).
          template: repository
          base: ''
          user: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}

          # Plugins
          plugin_contributors: yes
          plugin_contributors_categories: |
            {
              "Apps": ["apps/cli/**", "apps/desktop/**", "apps/web/**"],
              "Packages": ["packages/core/**", "packages/ui/**", "packages/chat/**", "packages/kanban/**", "packages/os/**", "packages/presentation/**", "packages/api-client/**"],
              "Docs": ["apps/docs/**", "docs/**"]
            }
          plugin_followup: yes
          plugin_followup_sections: pr, issue
          plugin_languages: yes
          plugin_languages_details: lines, percentage
          plugin_languages_limit: 8
          plugin_lines: yes
          plugin_traffic: yes
          plugin_stargazers: yes
          plugin_stargazers_charts_type: chartist

          config_timezone: Asia/Shanghai
          config_display: large
