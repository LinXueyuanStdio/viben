name: Release All (Unified)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0). Leave empty to use version from package.json'
        required: false
        type: string
      release_cli:
        description: 'Release CLI (npm publish, homebrew update)'
        type: boolean
        default: true
      release_desktop:
        description: 'Release Desktop (multi-platform build)'
        type: boolean
        default: true
      skip_desktop_tests:
        description: 'Skip Desktop E2E tests before release'
        type: boolean
        default: true
      draft:
        description: 'Create as draft release'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (build and test only, skip publishing)'
        type: boolean
        default: true

# Ensure only one release workflow runs at a time
concurrency:
  group: release-all-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  # =============================================================================
  # PREPARE: Extract version and sync all package files
  # =============================================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-version.outputs.tag }}
      release_cli: ${{ steps.get-version.outputs.release_cli }}
      release_desktop: ${{ steps.get-version.outputs.release_desktop }}
      skip_desktop_tests: ${{ steps.get-version.outputs.skip_desktop_tests }}
      is_draft: ${{ steps.get-version.outputs.is_draft }}
      dry_run: ${{ steps.get-version.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get version and determine release targets
        id: get-version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual trigger
            if [[ -n "${{ inputs.version }}" ]]; then
              VERSION="${{ inputs.version }}"
            else
              VERSION=$(jq -r '.version' package.json)
            fi
            RELEASE_CLI="${{ inputs.release_cli }}"
            RELEASE_DESKTOP="${{ inputs.release_desktop }}"
            SKIP_DESKTOP_TESTS="${{ inputs.skip_desktop_tests }}"
            IS_DRAFT="${{ inputs.draft }}"
            DRY_RUN="${{ inputs.dry_run }}"
          else
            # Tag trigger (v0.2.0 -> 0.2.0)
            VERSION="${GITHUB_REF_NAME#v}"
            RELEASE_CLI="true"
            RELEASE_DESKTOP="true"
            SKIP_DESKTOP_TESTS="false"
            IS_DRAFT="false"
            DRY_RUN="false"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "release_cli=${RELEASE_CLI}" >> $GITHUB_OUTPUT
          echo "release_desktop=${RELEASE_DESKTOP}" >> $GITHUB_OUTPUT
          echo "skip_desktop_tests=${SKIP_DESKTOP_TESTS}" >> $GITHUB_OUTPUT
          echo "is_draft=${IS_DRAFT}" >> $GITHUB_OUTPUT
          echo "dry_run=${DRY_RUN}" >> $GITHUB_OUTPUT

          echo "=========================================="
          echo "Release Configuration:"
          echo "  Version: ${VERSION}"
          echo "  Tag: v${VERSION}"
          echo "  Release CLI: ${RELEASE_CLI}"
          echo "  Release Desktop: ${RELEASE_DESKTOP}"
          echo "  Skip Desktop Tests: ${SKIP_DESKTOP_TESTS}"
          echo "  Draft: ${IS_DRAFT}"
          echo "  Dry Run: ${DRY_RUN}"
          echo "=========================================="

  # =============================================================================
  # BUILD CLI: Build CLI and create sidecar binaries for each platform
  # =============================================================================
  build-cli:
    needs: prepare
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            sidecar_name: viben-aarch64-apple-darwin
            sidecar_name_x64: viben-x86_64-apple-darwin
          - platform: windows-latest
            sidecar_name: viben-x86_64-pc-windows-msvc.exe
          - platform: ubuntu-22.04
            sidecar_name: viben-x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Sync version to package files
        shell: bash
        run: ./scripts/sync-version.sh "${{ needs.prepare.outputs.version }}"

      - name: Build @viben/core
        run: pnpm turbo build --filter=@viben/core

      - name: Build viben CLI
        run: pnpm turbo build --filter=viben

      # Build sidecar binary for current platform
      - name: Build sidecar binary
        shell: bash
        run: |
          cd packages/core
          echo "Building sidecar for current platform..."
          npx tsx scripts/build-sidecar.ts --platform current

      # For macOS, also build x64 version (cross-compile)
      - name: Build additional macOS sidecar (x64)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          cd packages/core
          bun build dist/cli/bin.js --compile --target bun-darwin-x64 --outfile ../../apps/desktop/src-tauri/binaries/viben-x86_64-apple-darwin

      # Bun-compiled binaries require entitlements for codesign on macOS
      - name: Codesign sidecar binaries (macOS)
        if: matrix.platform == 'macos-latest'
        uses: ./.github/actions/codesign-sidecar

      # Prepare sidecar artifact directory
      - name: Prepare sidecar artifact
        shell: bash
        run: |
          mkdir -p sidecar-artifact
          cp apps/desktop/src-tauri/binaries/viben-* sidecar-artifact/
          cp -R packages/core/templates sidecar-artifact/templates
          echo "Sidecar artifact contents:"
          ls -la sidecar-artifact/

      # Upload sidecar artifact
      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v7
        with:
          name: sidecar-${{ matrix.platform }}
          path: sidecar-artifact/
          if-no-files-found: error
          retention-days: 1

      # Upload CLI build for testing (only on ubuntu)
      - name: Upload CLI build artifact
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v7
        with:
          name: cli-build
          path: |
            apps/cli/bin/
            apps/cli/dist/
            apps/cli/package.json
            packages/core/dist/
            packages/core/package.json
          retention-days: 1

  # =============================================================================
  # TEST CLI: Run integration tests on bundled sidecar binaries (multi-platform)
  # =============================================================================
  test-cli:
    needs: [prepare, build-cli]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            binary: viben-aarch64-apple-darwin
            test_script: scripts/macos/test-cli-gateway.sh
          - platform: windows-latest
            binary: viben-x86_64-pc-windows-msvc.exe
            test_script: scripts/windows/test-cli-gateway.bat
          - platform: ubuntu-22.04
            binary: viben-x86_64-unknown-linux-gnu
            test_script: scripts/linux/test-cli-gateway.sh
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          token: ${{ secrets.GH_PAT }}

      # Download the sidecar binary built by build-cli
      - name: Download sidecar artifact
        uses: actions/download-artifact@v8
        with:
          name: sidecar-${{ matrix.platform }}
          path: .

      - name: List sidecar binaries
        shell: bash
        run: ls -la

      - name: Make binary executable (Unix)
        if: matrix.platform != 'windows-latest'
        run: chmod +x "${{ matrix.binary }}"

      # Run platform-specific bundled CLI + gateway test script (Unix)
      - name: Run bundled CLI + gateway tests (Unix)
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: |
          chmod +x "${{ matrix.test_script }}"
          "${{ matrix.test_script }}" "./${{ matrix.binary }}"

      # Run platform-specific bundled CLI + gateway test script (Windows)
      - name: Run bundled CLI + gateway tests (Windows)
        if: matrix.platform == 'windows-latest'
        shell: cmd
        run: ${{ matrix.test_script }} "${{ matrix.binary }}"

      # Print gateway startup log for CI visibility
      - name: Print gateway startup log
        if: always()
        shell: bash
        run: |
          echo "=== Gateway Startup Log ==="
          if [ -f "gateway-startup.log" ]; then
            cat gateway-startup.log
          else
            echo "No gateway-startup.log found (gateway may not have started)"
          fi

      # Ubuntu-only: also run Node.js CLI integration tests
      - name: Setup Node.js + pnpm (for integration tests)
        if: matrix.platform == 'ubuntu-22.04'
        uses: ./.github/actions/setup-node-pnpm
        with:
          install: 'false'

      - name: Download CLI build artifact
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/download-artifact@v8
        with:
          name: cli-build
          path: .

      - name: Install dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: pnpm install --frozen-lockfile

      - name: Make Node.js CLI executable
        if: matrix.platform == 'ubuntu-22.04'
        run: chmod +x apps/cli/bin/viben.js

      - name: Run Node.js CLI integration tests
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          chmod +x scripts/test-cli.sh
          ./scripts/test-cli.sh --local

      - name: Test CLI via npx simulation
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          TEST_DIR=$(mktemp -d)
          cd "$TEST_DIR"

          npm link "$GITHUB_WORKSPACE/apps/cli"

          viben --version
          viben --help
          viben init --user ci-test -y
          viben config list
          viben --json config list | jq .

          npm unlink -g viben
          rm -rf "$TEST_DIR"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cli-test-results-${{ matrix.platform }}
          path: |
            test-results/
            *.log
          retention-days: 7
          if-no-files-found: ignore

  # =============================================================================
  # RELEASE CLI: Publish to npm (depends on build-cli and test-cli)
  # =============================================================================
  release-cli:
    needs: [prepare, build-cli, test-cli]
    if: |
      needs.prepare.outputs.release_cli == 'true' &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.test-cli.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sha256: ${{ steps.get-sha256.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          install: 'false'
          registry-url: 'https://registry.npmjs.org'

      # Reuse CLI build from build-cli job (already version-synced and built)
      - name: Download CLI build artifact
        uses: actions/download-artifact@v8
        with:
          name: cli-build
          path: .

      - name: Verify CLI build artifacts
        run: |
          echo "=== CLI artifacts ==="
          ls -la apps/cli/
          ls -la apps/cli/dist/
          ls -la apps/cli/bin/
          echo "=== Core artifacts ==="
          ls -la packages/core/dist/
          echo "=== Version check ==="
          echo "CLI version: $(jq -r '.version' apps/cli/package.json)"
          echo "Core version: $(jq -r '.version' packages/core/package.json)"

      - name: Verify no workspace protocol references in runtime dependencies
        run: |
          cd apps/cli
          WORKSPACE_REFS=$(jq -r '
            [(.dependencies // {}), (.optionalDependencies // {})]
            | map(to_entries[])
            | map(select(.value | test("^workspace:")))
            | map("\(.key): \(.value)")
            | .[]' package.json)
          if [ -n "$WORKSPACE_REFS" ]; then
            echo "::error::Runtime dependencies contain workspace: protocol references that will break npm install"
            echo "$WORKSPACE_REFS"
            exit 1
          fi
          echo "✅ No workspace: protocol references in runtime dependencies"

      - name: Publish to npm
        run: |
          cd apps/cli
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for npm propagation and get SHA256
        id: get-sha256
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          PACKAGE_URL="https://registry.npmjs.org/viben/-/viben-${VERSION}.tgz"

          echo "Waiting for npm package to be available..."
          for i in {1..60}; do
            if curl -sf "$PACKAGE_URL" -o /tmp/package.tgz; then
              echo "Package available after $((i*10)) seconds"
              SHA256=$(shasum -a 256 /tmp/package.tgz | cut -d' ' -f1)
              echo "sha256=${SHA256}" >> $GITHUB_OUTPUT
              echo "Package SHA256: ${SHA256}"
              exit 0
            fi
            echo "Waiting for npm propagation... attempt $i/60"
            sleep 10
          done

          echo "::error::Package not available after 10 minutes"
          exit 1

      - name: Prepare install.sh for release
        run: |
          chmod +x scripts/install.sh
          mkdir -p release-assets
          cp scripts/install.sh release-assets/install.sh

      - name: Upload CLI assets
        uses: actions/upload-artifact@v7
        with:
          name: cli-assets
          path: release-assets/
          retention-days: 1

  # =============================================================================
  # HOMEBREW UPDATE (depends on release-cli)
  # =============================================================================
  update-homebrew:
    needs: [prepare, release-cli]
    runs-on: ubuntu-latest
    if: |
      needs.prepare.outputs.release_cli == 'true' &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.release-cli.outputs.sha256 != ''
    steps:
      - name: Checkout homebrew-viben
        uses: actions/checkout@v6
        with:
          repository: LinXueyuanStdio/homebrew-viben
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-viben
        continue-on-error: true

      - name: Check if tap exists
        id: check-tap
        run: |
          if [ -d "homebrew-viben" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::warning::Homebrew tap repository not found. Skipping formula update."
          fi

      - name: Update formula
        if: steps.check-tap.outputs.exists == 'true'
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          SHA256="${{ needs.release-cli.outputs.sha256 }}"

          cd homebrew-viben
          mkdir -p Formula

          cat > Formula/viben.rb << EOF
          class Viben < Formula
            desc "Orchestrate AI agent clusters in your local workspace"
            homepage "https://github.com/LinXueyuanStdio/viben"
            url "https://registry.npmjs.org/viben/-/viben-${VERSION}.tgz"
            sha256 "${SHA256}"
            license "MIT"

            depends_on "node"

            def install
              system "npm", "install", *std_npm_args
              bin.install_symlink Dir["#{libexec}/bin/*"]
            end

            test do
              assert_match "Viben CLI", shell_output("#{bin}/viben --help")
            end
          end
          EOF

          echo "Updated formula:"
          cat Formula/viben.rb

      - name: Commit and push
        if: steps.check-tap.outputs.exists == 'true'
        run: |
          cd homebrew-viben
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/viben.rb
          git diff --cached --quiet || git commit -m "Update viben to ${{ needs.prepare.outputs.version }}"
          git push

  # =============================================================================
  # BUILD DESKTOP: Multi-platform builds (depends on build-cli and test-cli)
  # =============================================================================
  build-desktop:
    needs: [prepare, build-cli, test-cli]
    if: needs.prepare.outputs.release_desktop == 'true' && needs.test-cli.result == 'success'
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds both ARM64 and x64 via cross-compilation on ARM64 runner
          - platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            sidecar_artifact: sidecar-macos-latest
            build_targets: "aarch64,x64"
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            sidecar_artifact: sidecar-windows-latest
            build_targets: "x64"
          - platform: ubuntu-22.04
            args: ''
            rust_targets: x86_64-unknown-linux-gnu
            sidecar_artifact: sidecar-ubuntu-22.04
            build_targets: "x64"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'
          shared-key: ${{ matrix.platform }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libfuse2

      # Download sidecar binaries from build-cli job
      - name: Download sidecar artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.sidecar_artifact }}
          path: apps/desktop/src-tauri/binaries/

      - name: Make sidecar executable (Unix)
        if: matrix.platform != 'windows-latest'
        run: chmod +x apps/desktop/src-tauri/binaries/viben-*

      - name: Codesign sidecar binaries (macOS)
        if: matrix.platform == 'macos-latest'
        uses: ./.github/actions/codesign-sidecar

      - name: Prepare desktop bundled templates (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          rm -rf apps/desktop/src-tauri/resources/templates
          mkdir -p apps/desktop/src-tauri/resources
          cp -R packages/core/templates apps/desktop/src-tauri/resources/templates

      - name: Build workspace packages
        run: pnpm turbo build --filter=@viben/desktop^...

      - name: Sync version
        shell: bash
        run: ./scripts/sync-version.sh "${{ needs.prepare.outputs.version }}"

      # macOS: Build both ARM64 and x64 targets
      # Note: DMG bundling is flaky in CI, using retryAttempts to handle intermittent failures
      - name: Build Tauri app (macOS ARM64)
        if: matrix.platform == 'macos-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_WEBVIEW_AUTOMATION: true
        with:
          projectPath: apps/desktop
          tagName: ''
          releaseName: ''
          args: --target aarch64-apple-darwin
          retryAttempts: 3

      - name: Build Tauri app (macOS x64)
        if: matrix.platform == 'macos-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_WEBVIEW_AUTOMATION: true
        with:
          projectPath: apps/desktop
          tagName: ''
          releaseName: ''
          args: --target x86_64-apple-darwin
          retryAttempts: 3

      # Windows: Build single target
      - name: Build Tauri app (Windows)
        if: matrix.platform == 'windows-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_WEBVIEW_AUTOMATION: true
        with:
          projectPath: apps/desktop
          tagName: ''
          releaseName: ''
          args: ${{ matrix.args }}

      # Linux: Build only deb (AppImage is unreliable in CI)
      - name: Build Tauri app (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_WEBVIEW_AUTOMATION: true
        with:
          projectPath: apps/desktop
          tagName: ''
          releaseName: ''
          args: --bundles deb

      - name: Find and upload build artifacts
        shell: bash
        run: |
          mkdir -p desktop-artifacts

          if [[ "${{ matrix.platform }}" == "macos-latest" ]]; then
            find apps/desktop/src-tauri/target -name "*.dmg" -exec cp {} desktop-artifacts/ \;
          elif [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            find apps/desktop/src-tauri/target -name "*.msi" -exec cp {} desktop-artifacts/ \;
            find apps/desktop/src-tauri/target -name "*-setup.exe" -exec cp {} desktop-artifacts/ \;
          elif [[ "${{ matrix.platform }}" == "ubuntu-22.04" ]]; then
            find apps/desktop/src-tauri/target -name "*.deb" -exec cp {} desktop-artifacts/ \;
          fi

          echo "Found artifacts:"
          ls -la desktop-artifacts/

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          path: desktop-artifacts/
          retention-days: 1

  # =============================================================================
  # TEST DESKTOP: E2E UI tests on built artifacts (multi-platform)
  # =============================================================================
  test-desktop:
    needs: [prepare, build-desktop]
    if: |
      needs.prepare.outputs.release_desktop == 'true' &&
      needs.prepare.outputs.skip_desktop_tests != 'true' &&
      needs.build-desktop.result == 'success'
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact: desktop-ubuntu-22.04
            test_script: scripts/linux/test-desktop-ui.sh
            summary_script: scripts/linux/test-desktop-summary.sh
          - platform: macos-latest
            artifact: desktop-macos-latest
            test_script: scripts/macos/test-desktop-ui.sh
            summary_script: scripts/macos/test-desktop-summary.sh
          - platform: windows-latest
            artifact: desktop-windows-latest
            test_script: scripts/windows/test-desktop-ui.bat
            summary_script: scripts/windows/test-desktop-summary.bat
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          token: ${{ secrets.GH_PAT }}

      - name: Download desktop artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: desktop-artifact

      - name: List downloaded artifacts
        shell: bash
        run: |
          echo "Downloaded artifacts:"
          ls -la desktop-artifact/

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop/src-tauri -> target'
          shared-key: ${{ matrix.platform }}-test

      - name: Install tauri-driver (Linux/Windows only)
        if: matrix.platform != 'macos-latest'
        run: cargo install tauri-driver

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb at-spi2-core imagemagick webkit2gtk-driver

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Unix (Linux/macOS)
      - name: Run E2E tests (Unix)
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: |
          chmod +x "${{ matrix.test_script }}"
          "${{ matrix.test_script }}"

      # Windows
      - name: Run E2E tests (Windows)
        if: matrix.platform == 'windows-latest'
        shell: cmd
        run: ${{ matrix.test_script }}

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-screenshots-${{ matrix.platform }}
          path: test-screenshots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-logs-${{ matrix.platform }}
          path: |
            wdio-results.xml
            apps/desktop/wdio-results.xml
            *.log
          retention-days: 7
          if-no-files-found: ignore

      # Unix (Linux/macOS)
      - name: Generate job summary (Unix)
        if: always() && matrix.platform != 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          chmod +x "${{ matrix.summary_script }}"
          "${{ matrix.summary_script }}" test-screenshots wdio-results.xml

      # Windows
      - name: Generate job summary (Windows)
        if: always() && matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: cmd
        run: ${{ matrix.summary_script }} test-screenshots wdio-results.xml

  # =============================================================================
  # CREATE UNIFIED RELEASE
  # =============================================================================
  create-unified-release:
    needs: [prepare, release-cli, build-desktop, test-desktop]
    if: |
      always() &&
      needs.prepare.outputs.dry_run != 'true' &&
      (needs.release-cli.result == 'success' || needs.build-desktop.result == 'success') &&
      (needs.test-desktop.result == 'success' || needs.test-desktop.result == 'skipped') &&
      needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create release directory
        run: mkdir -p release-assets

      - name: Download CLI assets
        if: needs.release-cli.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: cli-assets
          path: release-assets/
        continue-on-error: true

      - name: Download macOS desktop artifacts
        if: needs.build-desktop.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: desktop-macos-latest
          path: release-assets/
        continue-on-error: true

      - name: Download Windows desktop artifacts
        if: needs.build-desktop.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: desktop-windows-latest
          path: release-assets/
        continue-on-error: true

      - name: Download Linux desktop artifacts
        if: needs.build-desktop.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: desktop-ubuntu-22.04
          path: release-assets/
        continue-on-error: true

      - name: List all release assets
        run: |
          echo "Release assets:"
          ls -la release-assets/ || echo "No assets found"

      - name: Generate checksums
        run: |
          cd release-assets
          if ls * 1> /dev/null 2>&1; then
            sha256sum * > checksums.txt 2>/dev/null || true
            echo "Generated checksums:"
            cat checksums.txt
          else
            echo "No files to checksum"
          fi

      - name: Determine release components
        id: components
        run: |
          CLI_RELEASED="${{ needs.release-cli.result == 'success' }}"
          DESKTOP_RELEASED="${{ needs.build-desktop.result == 'success' }}"

          if [[ "$CLI_RELEASED" == "true" && "$DESKTOP_RELEASED" == "true" ]]; then
            RELEASE_NAME="Viben v${{ needs.prepare.outputs.version }}"
            COMPONENTS="CLI + Desktop"
          elif [[ "$CLI_RELEASED" == "true" ]]; then
            RELEASE_NAME="Viben CLI v${{ needs.prepare.outputs.version }}"
            COMPONENTS="CLI only"
          else
            RELEASE_NAME="Viben Desktop v${{ needs.prepare.outputs.version }}"
            COMPONENTS="Desktop only"
          fi

          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "components=${COMPONENTS}" >> $GITHUB_OUTPUT
          echo "cli_released=${CLI_RELEASED}" >> $GITHUB_OUTPUT
          echo "desktop_released=${DESKTOP_RELEASED}" >> $GITHUB_OUTPUT

      - name: Generate release body
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CLI_RELEASED: ${{ steps.components.outputs.cli_released }}
          DESKTOP_RELEASED: ${{ steps.components.outputs.desktop_released }}
        run: |
          CHANGELOG_PATH="docs/changelogs/${VERSION}.md"

          # Start with version header
          echo "## Viben v${VERSION}" > release-body.md
          echo "" >> release-body.md

          # If changelog exists, include it first
          if [[ -f "$CHANGELOG_PATH" ]]; then
            echo "Found changelog at $CHANGELOG_PATH"
            cat "$CHANGELOG_PATH" >> release-body.md
            echo "" >> release-body.md
            echo "---" >> release-body.md
            echo "" >> release-body.md
          else
            echo "No changelog found at $CHANGELOG_PATH, using default release notes"
          fi

          if [[ "$CLI_RELEASED" == "true" ]]; then
            cat >> release-body.md << 'EOFCLI'
          ### CLI Installation

          #### Shell Script (macOS/Linux)
          ```bash
          curl -fsSL https://github.com/LinXueyuanStdio/viben/releases/latest/download/install.sh | bash
          ```

          #### npx (macOS/Linux/Windows, Node.js 18+)
          ```bash
          npx viben
          ```

          #### npm Global Install (macOS/Linux/Windows)
          ```bash
          npm install -g viben
          viben
          ```

          #### Homebrew (macOS/Linux)
          ```bash
          brew tap LinXueyuanStdio/viben
          brew install viben
          ```

          > Windows users: Use `npm install -g viben` or `npx viben`. Requires [Node.js 18+](https://nodejs.org).

          EOFCLI
          fi

          if [[ "$DESKTOP_RELEASED" == "true" ]]; then
            cat >> release-body.md << 'EOFDESKTOP'
          ### Desktop Installation

          Desktop app includes bundled Viben CLI - no separate installation required!

          #### macOS
          - **Apple Silicon (M1/M2/M3)**: Download the `aarch64` DMG file
          - **Intel**: Download the `x86_64` DMG file
          - Drag Viben to Applications

          > **Important**: Before first launch, run the command below to clear quarantine attributes. Otherwise macOS will show "Viben.app is damaged and can't be opened":
          > ```bash
          > sudo /usr/bin/xattr -cr /Applications/Viben.app
          > ```

          #### Windows
          Download the `.msi` or `.exe` installer and run it.

          #### Linux
          - **Debian/Ubuntu**: Download `.deb` and install with `sudo dpkg -i`

          EOFDESKTOP
          fi

          cat >> release-body.md << 'EOFFOOTER'
          ### Checksums

          See `checksums.txt` attached to this release for SHA256 checksums of all artifacts.

          ### Links

          - [Documentation](https://github.com/LinXueyuanStdio/viben)
          - [npm Package](https://www.npmjs.com/package/viben)
          - [Changelog](https://github.com/LinXueyuanStdio/viben/blob/main/CHANGELOG.md)
          EOFFOOTER

          echo "Generated release body:"
          cat release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ steps.components.outputs.release_name }}
          body_path: release-body.md
          files: release-assets/*
          draft: ${{ needs.prepare.outputs.is_draft == 'true' }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate unified releases.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
          CLI_RELEASED: ${{ steps.components.outputs.cli_released }}
          DESKTOP_RELEASED: ${{ steps.components.outputs.desktop_released }}
        run: |
          # Wait for release to be available with retry
          echo "Waiting for release to be available..."
          for i in {1..6}; do
            RELEASE_DATA=$(gh api repos/${{ github.repository }}/releases/tags/$TAG_NAME 2>/dev/null || echo '')
            if [ -n "$RELEASE_DATA" ] && [ "$RELEASE_DATA" != "" ]; then
              ASSET_COUNT=$(echo "$RELEASE_DATA" | jq -r '.assets | length')
              if [ "$ASSET_COUNT" -gt 0 ]; then
                echo "Release found with $ASSET_COUNT assets after $((i*5)) seconds"
                break
              fi
            fi
            echo "Waiting for release... attempt $i/6"
            sleep 5
          done

          RELEASE_DATA=${RELEASE_DATA:-'{"assets":[]}'}
          ASSETS=$(echo "$RELEASE_DATA" | jq -r '.assets')

          # macOS has two DMG files: ARM64 (aarch64) and x64 (x86_64)
          DMG_ARM64_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".dmg")) | select(.name | contains("aarch64")) | .browser_download_url' | head -1)
          DMG_X64_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".dmg")) | select(.name | contains("x86_64") or contains("x64")) | .browser_download_url' | head -1)
          MSI_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".msi")) | .browser_download_url' | head -1)
          EXE_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith("-setup.exe")) | .browser_download_url' | head -1)
          DEB_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".deb")) | .browser_download_url' | head -1)
          INSTALL_SH_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name == "install.sh") | .browser_download_url' | head -1)

          DMG_ARM64_NAME=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".dmg")) | select(.name | contains("aarch64")) | .name' | head -1)
          DMG_X64_NAME=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".dmg")) | select(.name | contains("x86_64") or contains("x64")) | .name' | head -1)
          MSI_NAME=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".msi")) | .name' | head -1)
          EXE_NAME=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith("-setup.exe")) | .name' | head -1)
          DEB_NAME=$(echo "$ASSETS" | jq -r '.[] | select(.name | endswith(".deb")) | .name' | head -1)

          cat > release-assets/releases.json << EOF
          {
            "version": "${VERSION}",
            "tag": "${TAG_NAME}",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "repository": "${{ github.repository }}",
            "components": {
              "cli": ${CLI_RELEASED},
              "desktop": ${DESKTOP_RELEASED}
            },
            "cli": {
              "install_methods": {
                "shell": {
                  "command": "curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | bash",
                  "platforms": ["macos", "linux"]
                },
                "npx": {
                  "command": "npx viben",
                  "platforms": ["macos", "linux", "windows"]
                },
                "npm": {
                  "command": "npm install -g viben",
                  "platforms": ["macos", "linux", "windows"]
                },
                "homebrew": {
                  "command": "brew tap LinXueyuanStdio/viben && brew install viben",
                  "platforms": ["macos", "linux"]
                }
              },
              "assets": {
                "install_sh": {
                  "url": "${INSTALL_SH_URL}",
                  "name": "install.sh"
                }
              }
            },
            "desktop": {
              "assets": {
                "macos": {
                  "arm64": {
                    "url": "${DMG_ARM64_URL}",
                    "name": "${DMG_ARM64_NAME}"
                  },
                  "x64": {
                    "url": "${DMG_X64_URL}",
                    "name": "${DMG_X64_NAME}"
                  }
                },
                "windows": {
                  "msi": {
                    "url": "${MSI_URL}",
                    "name": "${MSI_NAME}"
                  },
                  "exe": {
                    "url": "${EXE_URL}",
                    "name": "${EXE_NAME}"
                  }
                },
                "linux": {
                  "deb": {
                    "url": "${DEB_URL}",
                    "name": "${DEB_NAME}"
                  }
                }
              }
            },
            "links": {
              "npm": "https://www.npmjs.com/package/viben",
              "documentation": "https://github.com/${{ github.repository }}",
              "changelog": "https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md"
            }
          }
          EOF

          echo "Generated releases.json:"
          cat release-assets/releases.json

      - name: Upload releases.json to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: release-assets/releases.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
