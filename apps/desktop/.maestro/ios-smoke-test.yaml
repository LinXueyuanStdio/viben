appId: com.viben.desktop
---
# Viben iOS Smoke Test
# Simplified test to verify basic UI elements

# Launch the app fresh
- launchApp:
    clearState: true

# Wait for app to fully load
- extendedWaitUntil:
    visible:
      text: "Viben"
    timeout: 45000

# Screenshot: Initial app state
- takeScreenshot: ios-01-app-launched

# =============================================================================
# Test 1: Verify header and branding
# =============================================================================
- assertVisible:
    text: "Viben"

# Screenshot: Header verified
- takeScreenshot: ios-02-header-verified

# =============================================================================
# Test 2: Verify Connect page content
# =============================================================================
- assertVisible:
    text: "Connect to Desktop"

- assertVisible:
    text: "Scan QR Code"

- assertVisible:
    text: "Enter URL manually"

# Screenshot: Connect page verified
- takeScreenshot: ios-03-connect-page

# =============================================================================
# Test 3: Test manual URL dialog
# =============================================================================
- tapOn:
    text: "Enter URL manually"

# Wait for dialog with increased timeout
- extendedWaitUntil:
    visible:
      text: "Enter Gateway URL"
    timeout: 10000
    optional: true

# Screenshot: Dialog state
- takeScreenshot: ios-04-dialog

# Close dialog if open
- tapOn:
    text: "Cancel"
    optional: true
- back

# Wait for main page
- extendedWaitUntil:
    visible:
      text: "Connect to Desktop"
    timeout: 5000

# =============================================================================
# Test 4: Final verification
# =============================================================================

# Final screenshot
- takeScreenshot: ios-05-final-state
