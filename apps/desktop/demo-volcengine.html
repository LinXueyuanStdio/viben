<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><title>火山引擎上报 Demo</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:720px;margin:30px auto;padding:0 20px;background:#f5f5f5}
  h1{font-size:20px} .card{background:#fff;border-radius:8px;padding:16px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  button{padding:8px 16px;margin:3px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;font-size:13px}
  button:hover{background:#f0f0f0} .primary{background:#1677ff;color:#fff;border-color:#1677ff}
  #log{background:#1e1e1e;color:#0f0;padding:12px;border-radius:6px;font:12px monospace;max-height:500px;overflow-y:auto;line-height:1.6}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
  .ok{background:#e6f7e6;color:#52c41a} .fail{background:#fff1f0;color:#ff4d4f}
</style></head>
<body>

<h1>🔍 火山引擎 @apmplus/web 上报 Demo</h1>
<div class="card">
  <span id="status" class="badge fail">未就绪</span>
  <span style="margin-left:12px">上报请求: <strong id="count">0</strong></span>
  <span style="margin-left:12px">AID: <code>1002552</code></span>
</div>

<div class="card">
  <strong>📤 发送测试事件</strong><br>
  <button onclick="send('app_launched',{platform:'demo',app_version:'1.0.0',is_first_launch:'true'})">🚀 app_launched</button>
  <button onclick="send('page_view',{page_name:'demo',page_path:'/demo'})">📄 page_view</button>
  <button onclick="send('chat_message_sent',{provider_type:'openai',model_id:'gpt-4',message_role:'user',workspace_id:'demo',token_count:42})">📨 chat_message_sent</button>
  <button onclick="send('app_error',{error_type:'TestError',error_message:'手动测试异常'})">💥 app_error</button>
  <button class="primary" onclick="batchSend()">📦 连续发10条</button>
</div>

<div id="log"></div>

<script>
(function() {
  var elLog = document.getElementById('log'), elStatus = document.getElementById('status'), elCount = document.getElementById('count');
  var count = 0;

  function log(msg, color) {
    var div = document.createElement('div');
    div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    if (color) div.style.color = color;
    elLog.appendChild(div); elLog.scrollTop = elLog.scrollHeight;
    console.log('[volc-demo]', msg);
  }

  // 拦截网络请求
  var origOpen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function(method, url) {
    if (/apmplus|volces/.test(url)) {
      count++; elCount.textContent = count;
      var short = url.slice(0, 120);
      log('📡 ' + method + ' ' + short, '#79c0ff');
      this.addEventListener('loadend', function() {
        var ok = this.status === 200 || this.status === 204;
        log('  ↳ ' + this.status + (ok ? ' ✅' : ' ❌'), ok ? '#3fb950' : '#f85149');
      });
    }
    origOpen.apply(this, arguments);
  };

  var origSend = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.send = function(body) {
    if (body) {
      try { log('  body: ' + (typeof body === 'string' ? body.slice(0, 200) : '[binary]')); } catch(e) {}
    }
    origSend.apply(this, arguments);
  };

  var origFetch = window.fetch;
  window.fetch = function(input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    if (/apmplus|volces/.test(url)) {
      count++; elCount.textContent = count;
      log('📡 fetch ' + url.slice(0, 120), '#79c0ff');
      if (init && init.body) {
        try { log('  body: ' + (typeof init.body === 'string' ? init.body.slice(0, 200) : '[binary]')); } catch(e) {}
      }
      return origFetch.apply(this, arguments).then(function(r) {
        log('  ↳ ' + r.status + (r.ok ? ' ✅' : ''), r.ok ? '#3fb950' : '#f85149');
        return r;
      });
    }
    return origFetch.apply(this, arguments);
  };

  // 加载 CDN SDK
  log('加载火山引擎 CDN SDK...');
  var s = document.createElement('script');
  s.src = 'https://apm.volccdn.com/mars-web/apmplus/web/browser.cn.js?aid=1002552&globalName=apmPlus';
  s.crossOrigin = 'anonymous';
  s.onload = function() {
    log('SDK 加载完成', '#3fb950');
    var a = window.apmPlus;
    if (!a) { log('❌ window.apmPlus 不存在', '#f85149'); return; }

    // 诊断可用 API
    var apis = [];
    for (var k in a) { if (typeof a[k] === 'function') apis.push(k); }
    log('可用 API: ' + apis.join(', '), '#ff9100');
    log('typeof apm.sendEvent = ' + typeof a.sendEvent);
    log('typeof apm.report = ' + typeof a.report);
    log('typeof apm.sendLog = ' + typeof a.sendLog);

    // 初始化
    a('init', { aid: 1002552, token: '4df738f04b384b28a8da2f7b60c36f46', env: 'development', release: '1.0.0-demo' });
    a('start');
    log('✅ SDK 初始化完成', '#3fb950');
    elStatus.textContent = '✅ 已就绪';
    elStatus.className = 'badge ok';
    window._apm = a;

    // 自动发一条
    setTimeout(function() { window.send('app_launched', { platform: 'web-demo', app_version: '1.0.0', is_first_launch: 'true' }); }, 500);
  };
  s.onerror = function() { log('❌ CDN SDK 加载失败', '#f85149'); };
  document.head.appendChild(s);

  window.send = function(name, params) {
    var a = window._apm;
    if (!a) { log('❌ SDK 未就绪', '#f85149'); return; }

    var categories = {}, metrics = {};
    for (var k in params) {
      var v = params[k];
      if (typeof v === 'number') metrics[k] = v;
      else categories[k] = String(v);
    }

    // 尝试 sendEvent（首选）
    if (typeof a.sendEvent === 'function') {
      a.sendEvent({ name: name, categories: categories, metrics: metrics });
      log('📤 [sendEvent] ' + name + ' ✅', '#3fb950');
    }
    // 尝试 command-style sendEvent
    else if (typeof a === 'function') {
      a('sendEvent', { name: name, categories: categories, metrics: metrics });
      log('📤 [command:sendEvent] ' + name + ' ✅', '#3fb950');
    }
    // fallback: report custom
    else if (typeof a.report === 'function') {
      a.report({ ev_type: 'custom', payload: { type: 'event', name: name, categories: categories, metrics: metrics } });
      log('📤 [report:custom] ' + name + ' ✅', '#3fb950');
    } else {
      log('❌ 无可用上报方法', '#f85149');
    }
  };

  window.batchSend = function() {
    log('📦 开始连续发送 10 条...');
    var events = [
      ['batch_e1', { batch:'volc-demo', index: '1' }],
      ['batch_e2', { batch:'volc-demo', index: '2' }],
      ['page_view', { page_name: 'batch', page_path: '/demo/batch' }],
      ['chat_message_sent', { provider_type:'anthropic', model_id:'claude-4', message_role:'user', workspace_id:'batch', token_count:100 }],
      ['chat_message_received', { provider_type:'anthropic', model_id:'claude-4', message_role:'assistant', workspace_id:'batch', token_count:200, duration_ms:1500 }],
      ['agent_created', { agent_id:'batch-agent', agent_name:'批量测试', workspace_id:'batch' }],
      ['workspace_created', { workspace_id:'batch-ws', action:'create' }],
      ['settings_changed', { setting_key:'theme', setting_value:'dark' }],
      ['skill_used', { skill_id:'test-skill', action:'install' }],
      ['app_error', { error_type:'BatchError', error_message:'批量测试完成' }],
    ];
    events.forEach(function(e, i) {
      setTimeout(function() { window.send(e[0], e[1]); }, i * 200);
    });
    setTimeout(function() { log('📦 10 条全部发送', '#1677ff'); }, 2500);
  };
})();
</script>
</body>
</html>
