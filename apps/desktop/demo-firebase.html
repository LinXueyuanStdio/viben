<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><title>Firebase 上报 Demo</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:720px;margin:30px auto;padding:0 20px;background:#f5f5f5}
  h1{font-size:20px} .card{background:#fff;border-radius:8px;padding:16px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  button{padding:8px 16px;margin:3px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;font-size:13px}
  button:hover{background:#f0f0f0} .primary{background:#ff9100;color:#fff;border-color:#ff9100}
  #log{background:#1e1e1e;color:#0f0;padding:12px;border-radius:6px;font:12px monospace;max-height:500px;overflow-y:auto;line-height:1.6}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
  .ok{background:#e6f7e6;color:#52c41a} .fail{background:#fff1f0;color:#ff4d4f}
</style></head>
<body>

<h1>🔥 Firebase Analytics 上报 Demo</h1>
<div class="card">
  <span id="status" class="badge fail">未就绪</span>
  <span style="margin-left:12px">上报次数: <strong id="count">0</strong></span>
  <span style="margin-left:12px">measurementId: <code>G-2Q89T9JQWD</code></span>
</div>

<div class="card">
  <strong>📤 发送测试事件</strong><br>
  <button onclick="send('app_launched',{platform:'demo',app_version:'1.0.0',is_first_launch:'true'})">🚀 app_launched</button>
  <button onclick="send('page_view',{page_name:'demo',page_path:'/demo'})">📄 page_view</button>
  <button onclick="send('chat_message_sent',{provider_type:'openai',model_id:'gpt-4',message_role:'user',workspace_id:'demo',token_count:42})">📨 chat_message_sent</button>
  <button onclick="send('app_error',{error_type:'TestError',error_message:'手动测试异常'})">💥 app_error</button>
  <button class="primary" onclick="batchSend()">📦 连续发10条</button>
</div>

<div class="card">
  <strong>🔬 其他测试</strong><br>
  <button onclick="setUserProps()">setUserProperties</button>
  <button onclick="setUid()">setUserId</button>
  <button onclick="logException()">logEvent('exception')</button>
</div>

<div id="log"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
  import {
    getAnalytics, logEvent, setUserId,
    setUserProperties as fbSetUserProperties,
  } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-analytics.js";

  const elLog = document.getElementById('log'), elStatus = document.getElementById('status'), elCount = document.getElementById('count');
  let count = 0;

  function log(msg, color) {
    var div = document.createElement('div');
    div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    if (color) div.style.color = color;
    elLog.appendChild(div); elLog.scrollTop = elLog.scrollHeight;
    console.log('[fb-demo]', msg);
  }

  // 拦截网络请求
  var origOpen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function(method, url) {
    if (/google-analytics|firebase|gtag/.test(url)) {
      count++; elCount.textContent = count;
      log('📡 ' + method + ' ' + url.slice(0, 100), '#79c0ff');
      this.addEventListener('loadend', function() {
        log('  ↳ ' + this.status + (this.status === 200 || this.status === 204 ? ' ✅' : this.status === 0 ? ' (sendBeacon)' : ' ❌'),
          this.status === 200 || this.status === 204 ? '#3fb950' : '#ff9100');
      });
    }
    origOpen.apply(this, arguments);
  };

  var origFetch = window.fetch;
  window.fetch = function(input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    if (/google-analytics|firebase|gtag/.test(url)) {
      count++; elCount.textContent = count;
      log('📡 fetch ' + url.slice(0, 100), '#79c0ff');
      return origFetch.apply(this, arguments).then(function(r) {
        log('  ↳ ' + r.status + ' type=' + r.type + (r.ok ? ' ✅' : ''), r.ok ? '#3fb950' : '#ff9100');
        return r;
      });
    }
    return origFetch.apply(this, arguments);
  };

  // 初始化
  log('初始化 Firebase...');

  // 启用 debug 日志
  try { window.localStorage.setItem('debug', 'firebase:analytics'); } catch(e) {}

  try {
    const app = initializeApp({
      apiKey: "AIzaSyC6TDECJaxRbX77Wqqqw7aygDoqGwOHWBc",
      authDomain: "viben-66118.firebaseapp.com",
      projectId: "viben-66118",
      storageBucket: "viben-66118.firebasestorage.app",
      messagingSenderId: "1080654454499",
      appId: "1:1080654454499:web:5d4cc59188f1f1c6c96fd6",
      measurementId: "G-2Q89T9JQWD",
    });
    const analytics = getAnalytics(app);

    log('✅ Firebase 初始化完成', '#3fb950');
    log('💡 Firebase 用 sendBeacon 发送 → Chrome DevTools 显示 status=0 是正常的', '#ff9100');
    log('💡 验证: Firebase Console → Analytics → DebugView（实时） 或 实时报告', '#ff9100');
    elStatus.textContent = '✅ Firebase 已就绪';
    elStatus.className = 'badge ok';

    window._fb = { app, analytics };

    window.send = function(eventName, params) {
      logEvent(analytics, eventName, params || {});
      count++; elCount.textContent = count;
      log('📤 logEvent("' + eventName + '") ' + JSON.stringify(params).slice(0, 120), '#3fb950');
    };

    window.setUserProps = function() {
      fbSetUserProperties(analytics, { demo_user: 'true', theme: 'dark', platform: 'web' });
      log('📤 setUserProperties({demo_user, theme, platform})', '#3fb950');
    };

    window.setUid = function() {
      setUserId(analytics, 'demo-user-' + Date.now());
      log('📤 setUserId("demo-user-...")', '#3fb950');
    };

    window.logException = function() {
      logEvent(analytics, 'exception', { description: '手动测试异常 ' + new Date().toISOString(), fatal: false });
      count++; elCount.textContent = count;
      log('📤 logEvent("exception")', '#3fb950');
    };

    window.batchSend = function() {
      log('📦 开始连续发送 10 条...');
      var events = [
        ['batch_e1', { batch:'fb-demo', index: '1' }],
        ['batch_e2', { batch:'fb-demo', index: '2' }],
        ['page_view', { page_name: 'batch', page_path: '/demo/batch' }],
        ['chat_message_sent', { provider_type:'anthropic', model_id:'claude-4', message_role:'user', workspace_id:'batch', token_count:100 }],
        ['chat_message_received', { provider_type:'anthropic', model_id:'claude-4', message_role:'assistant', workspace_id:'batch', token_count:200, duration_ms:1500 }],
        ['agent_created', { agent_id:'batch-agent', agent_name:'批量测试', workspace_id:'batch' }],
        ['workspace_created', { workspace_id:'batch-ws', action:'create' }],
        ['settings_changed', { setting_key:'theme', setting_value:'dark' }],
        ['skill_used', { skill_id:'test-skill', action:'install' }],
        ['app_error', { error_type:'BatchError', error_message:'批量测试完成' }],
      ];
      events.forEach(function(e, i) {
        setTimeout(function() { window.send(e[0], e[1]); }, i * 200);
      });
      setTimeout(function() { log('📦 10 条全部发送', '#ff9100'); }, 2500);
    };

    setTimeout(function() {
      window.send('app_launched', { platform: 'web-demo', app_version: '1.0.0', is_first_launch: 'true' });
    }, 500);

  } catch (e) {
    log('❌ 初始化失败: ' + e.message, '#f85149');
  }
</script>
</body>
</html>
