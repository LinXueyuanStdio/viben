[package]
name = "viben-desktop"
version = "0.1.0"
description = "Viben Desktop - Agent Swarm × Code Evolution"
authors = ["LinXueyuanStdio"]
edition = "2021"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.5"
tauri-plugin-shell = "2.3"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
tauri-plugin-deep-link = "2.4"
tauri-plugin-os = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "6"
which = "7"
glob = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
tempfile = "3"
urlencoding = "2"
screenshots = "0.8"
base64 = "0.22"
tauri-plugin-notification = "2.3"
tauri-plugin-updater = "2.10"
tauri-plugin-process = "2.3"
tauri-plugin-mcp = { git = "https://github.com/P3GLEG/tauri-plugin-mcp", version = "0.1.0" }
