[package]
name = "viben-desktop"
version = "0.1.0"
description = "Viben Desktop - Agent Swarm × Code Evolution"
authors = ["LinXueyuanStdio"]
edition = "2021"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10", features = [ "macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-deep-link = "2.4"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-os = "2.3"
tauri-plugin-notification = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "6"
which = "7"
glob = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
tempfile = "3"
urlencoding = "2"
base64 = "0.22"
tauri-plugin-updater = "2.10"
tauri-plugin-process = "2.3"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-opener = "2.5"
tauri-plugin-shell = "2.3"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
tauri-plugin-mcp = { git = "https://github.com/P3GLEG/tauri-plugin-mcp", version = "0.1.0" }
tauri-plugin-screenshots = "2.2.0"
xcap = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
tauri-plugin-safe-area-insets-css = "0.2"
