<!doctype html>
<html lang="en" style="height: 100%; overflow: hidden;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/viben.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Viben</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Theme flicker prevention: applies dark class before first paint -->
    <script>
      (function() {
        try {
          var storage = localStorage.getItem('viben-storage');
          if (storage) {
            var parsed = JSON.parse(storage);
            var theme = parsed.state && parsed.state.theme ? parsed.state.theme : 'system';
            var isDark = theme === 'dark' ||
              (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
              document.documentElement.classList.add('dark');
            }
          } else {
            // No storage yet, check system preference
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
              document.documentElement.classList.add('dark');
            }
          }
        } catch (e) {
          // Silently fail if localStorage is not available
        }
      })();
    </script>
  </head>

  <body style="height: 100%; margin: 0; overflow: hidden;">
    <div id="root" style="height: 100%;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
