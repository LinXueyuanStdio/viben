<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="searchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
  </defs>
  <!-- Background documents -->
  <rect x="50" y="80" width="120" height="160" rx="8" fill="#e5e7eb"/>
  <rect x="80" y="60" width="120" height="160" rx="8" fill="#f3f4f6"/>
  <rect x="110" y="40" width="120" height="160" rx="8" fill="white" stroke="#d1d5db"/>
  <!-- Document lines -->
  <rect x="125" y="60" width="80" height="8" rx="2" fill="#d1d5db"/>
  <rect x="125" y="80" width="60" height="8" rx="2" fill="#d1d5db"/>
  <rect x="125" y="100" width="70" height="8" rx="2" fill="#d1d5db"/>
  <rect x="125" y="120" width="50" height="8" rx="2" fill="#d1d5db"/>
  <!-- Magnifying glass -->
  <circle cx="280" cy="150" r="60" fill="none" stroke="url(#searchGrad)" stroke-width="12"/>
  <line x1="318" y1="188" x2="360" y2="230" stroke="url(#searchGrad)" stroke-width="12" stroke-linecap="round"/>
  <!-- Search result highlight -->
  <circle cx="280" cy="150" r="40" fill="#dbeafe" opacity="0.4"/>
  <rect x="260" y="135" width="40" height="6" rx="2" fill="#2563eb"/>
  <rect x="260" y="150" width="30" height="6" rx="2" fill="#60a5fa"/>
</svg>
