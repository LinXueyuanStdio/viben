model_name: "ni_hao_wei_ben"
target_phrase: "你好微本"

tts:
  model: "zh_CN-huayan-medium"
  num_samples: 5000

training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.001
  validation_split: 0.1

augmentation:
  noise_snr_range: [5, 20]
  speed_range: [0.9, 1.1]
  reverb: true
  pitch_shift_range: [-2, 2]

export:
  output_dir: "../../apps/desktop/public/openwakeword/models"
  threshold: 0.5
