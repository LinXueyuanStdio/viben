# 唤醒词训练配置 - "你好微本"
# 使用 livekit-wakeword + VoxCPM 中文 TTS
model_name: ni_hao_wei_ben
target_phrases:
  - "你好微本"

# TTS 后端 - 使用 VoxCPM 支持中文
tts_backend: voxcpm

# 训练样本数
n_samples: 25000
n_samples_val: 5000

# 模型配置
model:
  model_type: conv_attention
  model_size: small

# 训练步数
steps: 50000

# 目标误触率 (每小时)
target_fp_per_hour: 0.2

# VoxCPM TTS 配置 - 多样化中文说话人
