[tool.poetry]
name = "browse-mcp-proxy"
version = "0.1.1"
description = "A proxy server for MCP Inspector that enables browser-based connections to MCP servers."
authors = ["Xueyuan Lin <linxy59@mail2.sysu.edu.cn>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/LinXueyuanStdio/browse-mcp"
repository = "https://github.com/LinXueyuanStdio/browse-mcp"
keywords = ["mcp", "proxy", "inspector", "browser", "websocket"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
packages = [{ include = "browse_mcp_proxy" }]

[tool.poetry.scripts]
browse-mcp-proxy = "browse_mcp_proxy.__main__:main"

[tool.poetry.dependencies]
python = ">=3.10"
fastapi = ">=0.115.0"
uvicorn = {extras = ["standard"], version = ">=0.30.0"}
httpx = ">=0.28.1"
mcp = {extras = ["cli"], version = ">=1.6.0"}
typer = ">=0.12.0"
loguru = ">=0.7.0"
pydantic = ">=2.0.0"
sse-starlette = ">=2.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
