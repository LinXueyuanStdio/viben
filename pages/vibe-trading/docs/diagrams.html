/* ─── helpers ─────────────────────────────────────────── */
function rr(ctx, x, y, w, h, r, fill, stroke, sw) {
  sw = sw || 1.5;
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
  if (fill)  { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = sw; ctx.stroke(); }
}

function txt(ctx, s, x, y, sz, col, align, bold) {
  ctx.font = (bold ? '600 ' : '') + (sz||12) + 'px -apple-system,sans-serif';
  ctx.fillStyle = col || '#e6edf3';
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
}

function arrow(ctx, x1, y1, x2, y2, col, dashed) {
  const ang = Math.atan2(y2-y1, x2-x1);
  ctx.save();
  if (dashed) ctx.setLineDash([5,3]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
  ctx.strokeStyle = col||'#8b949e'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2 - 9*Math.cos(ang-0.38), y2 - 9*Math.sin(ang-0.38));
  ctx.lineTo(x2 - 9*Math.cos(ang+0.38), y2 - 9*Math.sin(ang+0.38));
  ctx.closePath(); ctx.fillStyle = col||'#8b949e'; ctx.fill();
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════
   SEQUENCE DIAGRAM
══════════════════════════════════════════════════════════ */
(function(){
  const cv = document.getElementById('seq');
  const c  = cv.getContext('2d');
  const W=1300, H=1180;

  c.fillStyle='#0d1117'; c.fillRect(0,0,W,H);
  for(let x=0;x<W;x+=30) for(let y=0;y<H;y+=30){
    c.fillStyle='#161b22';
    c.beginPath(); c.arc(x,y,0.8,0,Math.PI*2); c.fill();
  }

  /* participants */
  const P=[
    {name:['用户','(侧边栏)'],  x:72,  col:'#3fb950'},
    {name:['Agent','推理引擎'], x:214, col:'#58a6ff'},
    {name:['TopNav','(A)'],      x:368, col:'#388bfd'},
    {name:['StatCards','(C)'],   x:500, col:'#388bfd'},
    {name:['ChartArea','(D)'],   x:640, col:'#2ea043'},
    {name:['DataPanel','(E)'],   x:784, col:'#d2a8ff'},
    {name:['SidePanel','(F)'],   x:930, col:'#a371f7'},
    {name:['Dialog','(G)'],      x:1072,col:'#ff7b72'},
  ];
  const TOP=18, BH=54;
  P.forEach(p=>{
    rr(c,p.x-54,TOP,108,BH,7,'#161b22',p.col,2);
    p.name.forEach((ln,i)=>txt(c,ln,p.x,TOP+17+i*20,11,p.col,'center',i===0));
    c.save(); c.setLineDash([4,4]);
    c.beginPath(); c.moveTo(p.x,TOP+BH); c.lineTo(p.x,H-18);
    c.strokeStyle='#21262d'; c.lineWidth=1.5; c.stroke();
    c.restore();
  });

  let y=TOP+BH+18;

  function row(fx,tx,label,col,dashed,noteStr){
    const dir=tx>fx?1:-1;
    c.save();
    if(dashed) c.setLineDash([5,3]);
    c.beginPath(); c.moveTo(fx,y); c.lineTo(tx-dir*8,y);
    c.strokeStyle=col||'#c9d1d9'; c.lineWidth=1.5; c.stroke();
    c.setLineDash([]);
    c.beginPath(); c.moveTo(tx,y);
    c.lineTo(tx-dir*9,y-4); c.lineTo(tx-dir*9,y+4);
    c.closePath(); c.fillStyle=col||'#c9d1d9'; c.fill();
    if(label){
      const mx=(fx+tx)/2;
      c.font='11px -apple-system,sans-serif';
      c.fillStyle='#c9d1d9'; c.textAlign='center'; c.textBaseline='bottom';
      c.fillText(label,mx,y-2);
    }
    if(noteStr){
      const nx=Math.max(fx,tx)+10;
      c.font='10px -apple-system,sans-serif';
      c.fillStyle='#6e7681'; c.textAlign='left'; c.textBaseline='middle';
      c.fillText('← '+noteStr, nx, y);
    }
    c.restore();
    y+=30;
  }

  function phase(label){
    rr(c,0,y-2,W,22,0,'#161b22','transparent');
    c.strokeStyle='#30363d'; c.lineWidth=1;
    c.beginPath(); c.moveTo(0,y); c.lineTo(W,y); c.stroke();
    c.beginPath(); c.moveTo(0,y+22); c.lineTo(W,y+22); c.stroke();
    c.font='600 12px -apple-system,sans-serif';
    c.fillStyle='#79c0ff'; c.textAlign='left'; c.textBaseline='middle';
    c.fillText(label, 14, y+11);
    y+=36;
  }

  function act(x,y1,y2,col){
    rr(c,x-5,y1,10,y2-y1,3,col+'20',col,1);
  }

  const U=72, AG=214, A=368, C=500, D=640, E=784, F=930, G=1072;
  const S=30; /* step */

  /* ── 故事 1 ──────────────────────────────────────── */
  phase('故事 1 · 启动配置  —  用户给目标，Agent 弹出策略弹窗配置并启动');
  row(U,AG,'"帮我投 5000U，中等风险"','#3fb950');
  const a1s=y-S;
  row(AG,G,'open_strategy_dialog()','#58a6ff',false,'策略弹窗右侧滑入 300ms');
  row(AG,G,'set_param("symbols", ["BTC","ETH"])','#58a6ff',false,'字段蓝框 → 打入 → 消退');
  row(AG,G,'set_param("amount", 5000)','#58a6ff',false,'数字滚动填入');
  row(AG,G,'set_param("risk", "moderate")','#58a6ff',false,'选项高亮选中');
  act(AG,a1s,y,'#58a6ff');
  row(U,G,'用户点击"确认启动"','#3fb950',false,'modal 关闭');
  const a2s=y-S;
  row(AG,A,'confirm_start() → 状态灯亮绿','#388bfd',false);
  row(AG,C,'update_metrics({capital:5000})','#388bfd',false,'本金数字滚入');
  row(AG,D,'switch_symbol("BTC")','#2ea043',false,'K线加载');
  row(AG,F,'append_decision({session 启动})','#a371f7',false,'第一条决策日志');
  act(AG,a2s,y,'#388bfd');
  y+=8;

  /* ── 故事 2 ──────────────────────────────────────── */
  phase('故事 2 · 实时操盘  —  Agent 周期性分析，主页面全区域联动');
  const b1s=y;
  row(AG,D,'switch_chart_tab("kline")','#58a6ff',false,'tab 切换 200ms');
  row(AG,D,'switch_symbol("ETH")','#58a6ff',false,'K线重新加载');
  row(AG,F,'append_decision({#24, 分析中, ETH RSI=78})','#a371f7',false,'打字机效果滑入');
  row(AG,E,'expand_data_panel()','#58a6ff',false,'拉高动画');
  row(AG,E,'switch_data_tab("positions")','#58a6ff',false,'tab 切换');
  row(AG,E,'highlight_row("position","ETH")','#58a6ff',false,'蓝色底色 2s');

  act(AG,b1s,y-S,'#58a6ff');
  y+=8;

  /* ── 故事 2 续：下单流程 ───────────────────────────── */
  phase('故事 2 (续) · 涉及资金操作  —  弹窗确认，用户优先级始终最高');
  const c1s=y;
  row(AG,G,'open_order_dialog({sell,ETH,30%})','#58a6ff',false,'弹窗滑出，字段已填');
  row(G,U,'弹窗展示（主页面不可交互）','#ff7b72',true);
  act(AG,c1s,y,'#58a6ff');
  row(U,G,'用户点击"确认卖出"','#3fb950',false,'modal 确认');
  row(G,AG,'成交回调','#ff7b72',true);
  const c2s=y;

  row(AG,C,'flash_stat("pnl")','#58a6ff',false,'卡片辉光效果');
  row(AG,E,'update_positions([ETH已清仓])','#58a6ff',false,'持仓表更新');
  row(AG,F,'append_decision({#24, 卖出成交@3842})','#a371f7',false,'追加成交记录');
  act(AG,c2s,y-S,'#58a6ff');
  y+=8;

  /* ── 故事 3 ──────────────────────────────────────── */
  phase('故事 3 · 用户纠偏  —  侧边栏对话 → App 面板实时响应变化');
  row(U,AG,'"先停一停"','#3fb950');
  const d1s=y-S;
  row(AG,A,'pause_session()','#388bfd',false,'状态灯变黄 200ms');
  row(AG,F,'append_decision({已暂停})','#a371f7',false);
  act(AG,d1s,y-S,'#388bfd');

  row(U,AG,'"切到看 ETH 净值曲线"','#3fb950');
  const d2s=y-S;
  row(AG,D,'switch_symbol("ETH")','#2ea043',false);
  row(AG,D,'switch_chart_tab("nav")','#2ea043',false,'切到净值 tab');
  act(AG,d2s,y-S,'#2ea043');

  row(U,AG,'"平掉一半 BTC"','#3fb950');
  const d3s=y-S;
  row(AG,G,'open_order_dialog({sell,BTC,50%})','#ff7b72',false,'弹窗滑出');
  row(U,G,'用户点击"确认"','#3fb950');
  row(G,AG,'成交','#ff7b72',true);
  act(AG,d3s,y-S,'#ff7b72');
  y+=8;

  /* ── 故事 4 ──────────────────────────────────────── */
  phase('故事 4 · 复盘回放  —  PlayerBar 出现，整个 App 重演历史面板状态');
  row(U,AG,'"看看昨天的操作"','#3fb950');
  const e1s=y-S;
  row(AG,A,'enter_replay(startIndex:0)','#388bfd',false,'TopNav 标注"回放中"，PlayerBar 出现');
  row(AG,C,'(恢复历史 StatCards 快照)','#388bfd',true);
  row(AG,D,'(恢复历史 ChartArea 快照)','#2ea043',true);
  row(AG,E,'(恢复历史 DataPanel 快照)','#d2a8ff',true);
  row(AG,F,'(决策日志滚动到起始条目)','#a371f7',true);
  act(AG,e1s,y-S,'#388bfd');

  row(U,AG,'拖动进度条到 #22 (买入BTC)','#3fb950');
  const e2s=y-S;
  row(AG,C,'(跳转到该时刻指标快照)','#388bfd',true);
  row(AG,D,'(跳转到该时刻 K线位置)','#2ea043',true);
  row(AG,F,'(高亮 #22 决策日志条目)','#a371f7',true);
  act(AG,e2s,y-S,'#a371f7');

  row(U,AG,'"这步不该买"  (复盘评论)','#3fb950');
  const e3s=y-S;
  row(AG,F,'append_decision({用户标注 #22})','#a371f7',false,'评论显示在条目下方');
  act(AG,e3s,y-S,'#a371f7');

  row(U,A,'点击"🟢 实时"按钮','#3fb950');
  const e4s=y-S;
  row(A,AG,'exit_replay()','#388bfd',true);
  const e4e=y;
  act(A,e4s,e4e,'#388bfd');
  row(AG,A,'(PlayerBar 消失，恢复实时)','#388bfd',true);

  /* footer */
  c.font='10px -apple-system,sans-serif';
  c.fillStyle='#444c56'; c.textAlign='center'; c.textBaseline='middle';
  c.fillText('实线 = 主动工具调用  ·  虚线 = 响应/回调/被动更新  ·  绿色 = 用户操作（优先级始终最高）',W/2,H-10);
})();
</script>
