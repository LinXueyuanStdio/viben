<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>问财语音助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .badge {
      position: fixed; top: 20px; right: 20px;
      padding: 8px 16px; border-radius: 20px; font-size: 14px;
      background: rgba(255,255,255,0.1);
    }
    .badge.listening { background: #3498db; }
    .badge.active { background: #2ecc71; }
    .orb {
      width: 180px; height: 180px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #4facfe, #00f2fe);
      box-shadow: 0 0 60px rgba(79,172,254,0.5);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 48px; margin-bottom: 30px; transition: all 0.3s;
      position: relative;
    }
    .orb:hover { transform: scale(1.05); }
    .orb.listening {
      background: radial-gradient(circle at 30% 30%, #3498db, #2980b9);
      animation: pulse 1.5s infinite;
    }
    .orb.active { background: radial-gradient(circle at 30% 30%, #2ecc71, #27ae60); }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    /* 麦克风状态指示器 */
    .mic-status {
      position: absolute;
      bottom: -8px;
      right: -8px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #e74c3c;
      border: 3px solid #1a1a2e;
      transition: background 0.2s;
    }
    .mic-status.active {
      background: #2ecc71;
      animation: mic-pulse 0.5s infinite;
    }
    @keyframes mic-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .subtitle { font-size: 18px; color: rgba(255,255,255,0.7); margin-bottom: 20px; }
    .transcript {
      background: rgba(0,0,0,0.5); padding: 15px 25px; border-radius: 12px;
      font-size: 20px; min-width: 300px; text-align: center; min-height: 60px;
    }
    .greeting {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: white; color: #333; padding: 20px 40px;
      border-radius: 30px; font-size: 28px;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
    }
    .greeting.show { transform: translate(-50%, -50%) scale(1); }
    .hints { position: fixed; bottom: 30px; font-size: 14px; color: rgba(255,255,255,0.5); }
    .browser-warning {
      background: #e74c3c; padding: 15px 25px; border-radius: 10px;
      margin-bottom: 20px; text-align: center;
    }
    .debug-info {
      position: fixed; bottom: 60px; font-size: 12px;
      color: rgba(255,255,255,0.3); font-family: monospace;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="badge" id="badge">待机</div>

  <div class="browser-warning hidden" id="warning">
    请使用 <b>HTTPS</b> 访问本页面<br>
    <small>HTTP 模式下语音识别会频繁请求权限</small><br>
    <small>运行: node serve-https.js</small>
  </div>

  <div class="orb" id="orb">
    🎤
    <div class="mic-status" id="micStatus"></div>
  </div>
  <p class="subtitle" id="subtitle">点击开始</p>
  <div class="transcript" id="transcript"></div>
  <div class="greeting" id="greeting"></div>
  <div class="hints" id="hints"></div>
  <div class="debug-info" id="debug"></div>

  <script src="https://unpkg.com/@vocalbridgeai/sdk@latest/dist/vocal-bridge.umd.js"></script>
  <script>
    const CONFIG = {
      apiKey: 'vb_CFjVohGJ-_RuWvckZZDFjwyx8rdHQPWflnoFdw7oi7o',
      agentId: '4aa0dbed-5a24-44a2-b432-08a302c0e51b',
      wakeWords: ['你好问财', '问财', '你好 问财'],
      exitWords: ['退下', '不聊了', '再见', '拜拜', '结束'],
      idleTimeout: 3 * 60 * 1000
    };

    const GREETINGS = ['嗯','在呢','我在','来了','你好','哎','在的','说吧','好的','嘿','诶','讲','我在听','你说','好','随时','行','可以','收到','干嘛'];

    // State
    let state = 'idle';
    let recognition = null;
    let vocalBridge = null;
    let idleTimer = null;
    let mediaStream = null;      // 保持麦克风流始终打开
    let audioContext = null;
    let analyser = null;

    const $ = id => document.getElementById(id);

    // 检测 HTTPS
    if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      $('warning').classList.remove('hidden');
    }

    function debug(msg) {
      console.log(msg);
      $('debug').textContent = msg;
    }

    function setMicStatus(active) {
      $('micStatus').className = 'mic-status' + (active ? ' active' : '');
    }

    // 初始化语音识别
    function initRecognition() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        alert('浏览器不支持语音识别');
        return false;
      }

      recognition = new SR();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'zh-CN';
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        debug('recognition.onstart');
        setMicStatus(true);
      };

      recognition.onaudiostart = () => {
        debug('recognition.onaudiostart - 麦克风已激活');
      };

      recognition.onsoundstart = () => {
        debug('recognition.onsoundstart - 检测到声音');
      };

      recognition.onspeechstart = () => {
        debug('recognition.onspeechstart - 检测到语音');
      };

      recognition.onresult = e => {
        if (state !== 'listening') return;

        const result = e.results[e.results.length - 1];
        const text = result[0].transcript;
        const isFinal = result.isFinal;

        $('transcript').textContent = text + (isFinal ? '' : '...');
        debug(`result: "${text}" (final: ${isFinal})`);

        // 只在 final 结果时检查唤醒词
        if (isFinal) {
          for (const w of CONFIG.wakeWords) {
            if (text.includes(w) || text.includes('问财')) {
              onWake();
              return;
            }
          }
        }
      };

      recognition.onspeechend = () => {
        debug('recognition.onspeechend - 语音结束');
      };

      recognition.onsoundend = () => {
        debug('recognition.onsoundend - 声音结束');
      };

      recognition.onaudioend = () => {
        debug('recognition.onaudioend - 麦克风关闭');
        setMicStatus(false);
      };

      recognition.onerror = e => {
        debug(`recognition.onerror: ${e.error}`);
        setMicStatus(false);

        // no-speech 错误是正常的，不需要特殊处理
        if (e.error === 'no-speech') {
          debug('无语音输入，将自动重启...');
        }
      };

      recognition.onend = () => {
        debug('recognition.onend');
        setMicStatus(false);

        // 智能重启：避免过于频繁
        if (state === 'listening') {
          const now = Date.now();
          const timeSinceLastRestart = now - lastRestartTime;

          // 如果距离上次重启不到 500ms，等待更长时间
          const delay = timeSinceLastRestart < 500 ? 1000 : 100;

          debug(`将在 ${delay}ms 后重启...`);

          setTimeout(() => {
            if (state === 'listening') {
              lastRestartTime = Date.now();
              restartCount++;
              debug(`重启 #${restartCount}`);

              try {
                recognition.start();
              } catch (e) {
                debug(`重启失败: ${e.message}`);
                // 如果启动失败，等待更长时间再试
                setTimeout(() => {
                  if (state === 'listening') {
                    try { recognition.start(); } catch (e2) {}
                  }
                }, 1000);
              }
            }
          }, delay);
        }
      };

      return true;
    }

    function setState(s) {
      state = s;
      $('orb').className = 'orb ' + s;
      $('badge').className = 'badge ' + s;
      $('badge').textContent = { idle: '待机', listening: '监听中', active: '对话中' }[s] || s;

      // 更新 orb 内容但保留 mic-status
      const orbEl = $('orb');
      const icon = { idle: '🎤', listening: '👂', active: '💬' }[s] || '🎤';
      orbEl.childNodes[0].textContent = icon;

      $('hints').textContent = {
        listening: '说「你好问财」唤醒 | 点击停止',
        active: '说「退下」结束对话'
      }[s] || '';
    }

    function startListening() {
      setState('listening');
      $('subtitle').textContent = '说「你好问财」唤醒我';
      $('transcript').textContent = '正在监听...';
      restartCount = 0;
      lastRestartTime = 0;

      if (!recognition && !initRecognition()) return;

      try {
        recognition.start();
        debug('recognition.start() 已调用');
      } catch (e) {
        debug(`start 失败: ${e.message}`);
        // 可能已经在运行，尝试先停止再启动
        try {
          recognition.stop();
          setTimeout(() => {
            if (state === 'listening') {
              try { recognition.start(); } catch (e2) {}
            }
          }, 100);
        } catch (e2) {}
      }
    }

    function stopListening() {
      setState('idle');
      $('subtitle').textContent = '点击开始';
      $('transcript').textContent = '';
      setMicStatus(false);

      if (recognition) {
        try { recognition.stop(); } catch (e) {}
      }
    }

    function onWake() {
      debug('唤醒词检测到！');

      // 停止语音识别
      if (recognition) {
        try { recognition.stop(); } catch (e) {}
      }

      const g = GREETINGS[Math.floor(Math.random() * GREETINGS.length)];

      $('greeting').textContent = g;
      $('greeting').classList.add('show');
      setTimeout(() => $('greeting').classList.remove('show'), 1500);

      const u = new SpeechSynthesisUtterance(g);
      u.lang = 'zh-CN';
      u.rate = 1.1;
      speechSynthesis.speak(u);

      setTimeout(startConversation, 800);
    }

    async function startConversation() {
      setState('active');
      $('subtitle').textContent = '对话中...';
      $('transcript').textContent = '';
      resetIdleTimer();

      try {
        if (!vocalBridge) {
          vocalBridge = new VocalBridge({
            auth: { apiKey: CONFIG.apiKey, agentId: CONFIG.agentId },
            participantName: 'User',
            debug: true
          });

          vocalBridge.on('transcript', ({ role, text }) => {
            $('transcript').innerHTML = `<span style="opacity:0.6">${role === 'user' ? '你' : '问财'}:</span> ${text}`;
            resetIdleTimer();

            if (role === 'user') {
              for (const w of CONFIG.exitWords) {
                if (text.includes(w)) { endConversation(); return; }
              }
            }
          });

          vocalBridge.on('error', e => {
            console.error('VB error:', e);
            $('subtitle').textContent = '连接出错: ' + e.message;
          });
        }

        await vocalBridge.connect();
      } catch (e) {
        console.error('Connect failed:', e);
        $('subtitle').textContent = '连接失败';
        setTimeout(startListening, 2000);
      }
    }

    function resetIdleTimer() {
      if (idleTimer) clearTimeout(idleTimer);
      idleTimer = setTimeout(endConversation, CONFIG.idleTimeout);
    }

    async function endConversation() {
      if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }

      const u = new SpeechSynthesisUtterance('好的，有事再叫我');
      u.lang = 'zh-CN';
      speechSynthesis.speak(u);

      try { await vocalBridge?.disconnect(); } catch (e) {}

      $('transcript').textContent = '';
      setTimeout(startListening, 2000);
    }

    $('orb').onclick = () => {
      if (state === 'idle') startListening();
      else if (state === 'listening') stopListening();
      else if (state === 'active') endConversation();
    };

    debug('就绪');
  </script>
</body>
</html>
