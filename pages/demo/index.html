<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>问财语音助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .badge {
      position: fixed; top: 20px; right: 20px;
      padding: 8px 16px; border-radius: 20px; font-size: 14px;
      background: rgba(255,255,255,0.1);
    }
    .badge.listening { background: #3498db; }
    .badge.active { background: #2ecc71; }
    .orb {
      width: 180px; height: 180px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #4facfe, #00f2fe);
      box-shadow: 0 0 60px rgba(79,172,254,0.5);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 48px; margin-bottom: 30px; transition: all 0.3s;
    }
    .orb:hover { transform: scale(1.05); }
    .orb.listening { background: radial-gradient(circle at 30% 30%, #3498db, #2980b9); animation: pulse 1.5s infinite; }
    .orb.active { background: radial-gradient(circle at 30% 30%, #2ecc71, #27ae60); }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .subtitle { font-size: 18px; color: rgba(255,255,255,0.7); margin-bottom: 20px; }
    .transcript {
      background: rgba(0,0,0,0.5); padding: 15px 25px; border-radius: 12px;
      font-size: 20px; min-width: 300px; text-align: center; min-height: 60px;
    }
    .greeting {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: white; color: #333; padding: 20px 40px;
      border-radius: 30px; font-size: 28px;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
    }
    .greeting.show { transform: translate(-50%, -50%) scale(1); }
    .hints { position: fixed; bottom: 30px; font-size: 14px; color: rgba(255,255,255,0.5); }
    .browser-warning {
      background: #e74c3c; padding: 15px 25px; border-radius: 10px;
      margin-bottom: 20px; text-align: center;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="badge" id="badge">待机</div>

  <div class="browser-warning hidden" id="warning">
    请使用 <b>Safari</b> 浏览器以获得最佳体验<br>
    <small>Chrome 的语音识别会频繁请求权限</small>
  </div>

  <div class="orb" id="orb">🎤</div>
  <p class="subtitle" id="subtitle">点击开始</p>
  <div class="transcript" id="transcript"></div>
  <div class="greeting" id="greeting"></div>
  <div class="hints" id="hints"></div>

  <script src="https://unpkg.com/@vocalbridgeai/sdk@latest/dist/vocal-bridge.umd.js"></script>
  <script>
    const CONFIG = {
      apiKey: 'vb_CFjVohGJ-_RuWvckZZDFjwyx8rdHQPWflnoFdw7oi7o',
      agentId: '4aa0dbed-5a24-44a2-b432-08a302c0e51b',
      wakeWords: ['你好问财', '问财', '你好 问财'],
      exitWords: ['退下', '不聊了', '再见', '拜拜', '结束'],
      idleTimeout: 3 * 60 * 1000
    };

    const GREETINGS = ['嗯','在呢','我在','来了','你好','哎','在的','说吧','好的','嘿','诶','讲','我在听','你说','好','随时','行','可以','收到','干嘛'];

    // State
    let state = 'idle';
    let recognition = null;
    let vocalBridge = null;
    let idleTimer = null;
    let recognitionRestarting = false;

    // Elements
    const $ = id => document.getElementById(id);

    // 检测浏览器
    const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
    const isChrome = /chrome/i.test(navigator.userAgent) && !/edge/i.test(navigator.userAgent);

    if (isChrome) {
      $('warning').classList.remove('hidden');
    }

    // 初始化语音识别（只创建一次）
    function initRecognition() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        alert('浏览器不支持语音识别');
        return false;
      }

      recognition = new SR();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'zh-CN';

      recognition.onstart = () => {
        console.log('Recognition started');
        recognitionRestarting = false;
      };

      recognition.onresult = e => {
        if (state !== 'listening') return;

        const result = e.results[e.results.length - 1];
        const text = result[0].transcript;
        $('transcript').textContent = text;

        // 检查唤醒词
        for (const w of CONFIG.wakeWords) {
          if (text.includes(w) || text.includes('问财')) {
            onWake();
            return;
          }
        }
      };

      recognition.onerror = e => {
        console.log('Recognition error:', e.error);
        // 不在 error 中重启，让 onend 处理
      };

      recognition.onend = () => {
        console.log('Recognition ended, state:', state, 'restarting:', recognitionRestarting);

        // 只有在 listening 状态且未在重启中才重启
        if (state === 'listening' && !recognitionRestarting) {
          recognitionRestarting = true;
          // 延迟重启，避免过于频繁
          setTimeout(() => {
            if (state === 'listening') {
              try {
                recognition.start();
              } catch (e) {
                console.log('Restart failed:', e.message);
                recognitionRestarting = false;
              }
            }
          }, 300);
        }
      };

      return true;
    }

    // 状态管理
    function setState(s) {
      state = s;
      $('orb').className = 'orb ' + s;
      $('badge').className = 'badge ' + s;
      $('badge').textContent = { idle: '待机', listening: '监听中', active: '对话中' }[s] || s;
      $('orb').textContent = { idle: '🎤', listening: '👂', active: '💬' }[s] || '🎤';
      $('hints').textContent = {
        listening: '说「你好问财」唤醒 | 点击停止',
        active: '说「退下」结束对话'
      }[s] || '';
    }

    // 开始监听
    function startListening() {
      setState('listening');
      $('subtitle').textContent = '说「你好问财」唤醒我';
      $('transcript').textContent = '正在监听...';

      if (!recognition && !initRecognition()) return;

      try {
        recognition.start();
      } catch (e) {
        console.log('Start failed (may already be running):', e.message);
      }
    }

    // 停止监听
    function stopListening() {
      setState('idle');
      $('subtitle').textContent = '点击开始';
      $('transcript').textContent = '';

      if (recognition) {
        try {
          recognition.stop();
        } catch (e) {}
      }
    }

    // 唤醒
    function onWake() {
      // 先停止语音识别
      if (recognition) {
        try { recognition.stop(); } catch (e) {}
      }

      const g = GREETINGS[Math.floor(Math.random() * GREETINGS.length)];

      $('greeting').textContent = g;
      $('greeting').classList.add('show');
      setTimeout(() => $('greeting').classList.remove('show'), 1500);

      // 系统 TTS
      const u = new SpeechSynthesisUtterance(g);
      u.lang = 'zh-CN';
      u.rate = 1.1;
      speechSynthesis.speak(u);

      setTimeout(startConversation, 800);
    }

    // 开始对话
    async function startConversation() {
      setState('active');
      $('subtitle').textContent = '对话中...';
      $('transcript').textContent = '';
      resetIdleTimer();

      try {
        if (!vocalBridge) {
          vocalBridge = new VocalBridge({
            auth: { apiKey: CONFIG.apiKey, agentId: CONFIG.agentId },
            participantName: 'User',
            debug: true
          });

          vocalBridge.on('transcript', ({ role, text }) => {
            $('transcript').innerHTML = `<span style="opacity:0.6">${role === 'user' ? '你' : '问财'}:</span> ${text}`;
            resetIdleTimer();

            if (role === 'user') {
              for (const w of CONFIG.exitWords) {
                if (text.includes(w)) { endConversation(); return; }
              }
            }
          });

          vocalBridge.on('error', e => {
            console.error('VB error:', e);
            $('subtitle').textContent = '连接出错: ' + e.message;
          });
        }

        await vocalBridge.connect();
      } catch (e) {
        console.error('Connect failed:', e);
        $('subtitle').textContent = '连接失败';
        setTimeout(startListening, 2000);
      }
    }

    function resetIdleTimer() {
      if (idleTimer) clearTimeout(idleTimer);
      idleTimer = setTimeout(endConversation, CONFIG.idleTimeout);
    }

    async function endConversation() {
      if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }

      const u = new SpeechSynthesisUtterance('好的，有事再叫我');
      u.lang = 'zh-CN';
      speechSynthesis.speak(u);

      try { await vocalBridge?.disconnect(); } catch (e) {}

      $('transcript').textContent = '';
      setTimeout(startListening, 2000);
    }

    // 点击事件
    $('orb').onclick = () => {
      if (state === 'idle') startListening();
      else if (state === 'listening') stopListening();
      else if (state === 'active') endConversation();
    };

    // 初始化
    console.log('Browser:', isSafari ? 'Safari' : isChrome ? 'Chrome' : 'Other');
  </script>
</body>
</html>
