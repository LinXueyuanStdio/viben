<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #061d26; }
    .strip { width: min(760px, 100%); margin: 0 auto; background: #f8fdfe; }
    .panel { min-height: var(--h); background: var(--bg); background-size: cover; background-position: center; }
  </style>
</head>
<body>
  <main class="strip" aria-label="条漫阅读">
    <section class="panel" style="--h:340px;--bg:linear-gradient(135deg,#0f172a,#0891b2 58%,#d9f99d)"></section>
    <section class="panel" style="--h:240px;--bg:linear-gradient(135deg,#ecfeff,#bae6fd)"></section>
    <section class="panel" style="--h:420px;--bg:linear-gradient(135deg,#164e63,#0f766e 62%,#f0fdfa)"></section>
    <section class="panel" style="--h:310px;--bg:linear-gradient(135deg,#cffafe,#f8fdfe)"></section>
    <section class="panel" style="--h:460px;--bg:linear-gradient(135deg,#082f49,#22d3ee 48%,#dcfce7)"></section>
  </main>
</body>
</html>
