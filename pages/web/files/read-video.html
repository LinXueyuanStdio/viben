<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #020617; }
    main { width: 100vw; height: 100vh; display: grid; place-items: center; background: #020617; }
    iframe { width: min(1180px, 100vw); aspect-ratio: 16 / 9; border: 0; background: #000; }
  </style>
</head>
<body>
  <main aria-label="视频播放">
    <iframe
      title="YouTube 视频"
      src="https://www.youtube.com/embed/dQw4w9WgXcQ"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>
  </main>
</body>
</html>
