<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Central hub - Viben -->
  <circle cx="200" cy="150" r="45" fill="url(#agentGrad)"/>
  <text x="200" y="145" text-anchor="middle" fill="white" font-size="16" font-weight="bold">Viben</text>
  <text x="200" y="162" text-anchor="middle" fill="white" font-size="10">Unified</text>

  <!-- Connection lines -->
  <line x1="200" y1="105" x2="200" y2="60" stroke="#fcd34d" stroke-width="3" stroke-dasharray="5,3"/>
  <line x1="155" y1="150" x2="90" y2="150" stroke="#fcd34d" stroke-width="3" stroke-dasharray="5,3"/>
  <line x1="245" y1="150" x2="310" y2="150" stroke="#fcd34d" stroke-width="3" stroke-dasharray="5,3"/>
  <line x1="165" y1="180" x2="110" y2="230" stroke="#fcd34d" stroke-width="3" stroke-dasharray="5,3"/>
  <line x1="235" y1="180" x2="290" y2="230" stroke="#fcd34d" stroke-width="3" stroke-dasharray="5,3"/>

  <!-- Top node - Claude Code -->
  <rect x="155" y="20" width="90" height="40" rx="8" fill="#d97706" stroke="#f59e0b" stroke-width="2"/>
  <text x="200" y="45" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Claude Code</text>

  <!-- Left node - Cursor -->
  <rect x="30" y="130" width="60" height="40" rx="8" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <text x="60" y="155" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Cursor</text>

  <!-- Right node - Codex -->
  <rect x="310" y="130" width="60" height="40" rx="8" fill="#10a37f" stroke="#34d399" stroke-width="2"/>
  <text x="340" y="155" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Codex</text>

  <!-- Bottom left - MCP Servers -->
  <rect x="60" y="220" width="80" height="40" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
  <text x="100" y="238" text-anchor="middle" fill="#374151" font-size="10" font-weight="bold">MCP Servers</text>
  <text x="100" y="252" text-anchor="middle" fill="#6b7280" font-size="9">19+ tools</text>

  <!-- Bottom right - Skills -->
  <rect x="260" y="220" width="80" height="40" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
  <text x="300" y="238" text-anchor="middle" fill="#374151" font-size="10" font-weight="bold">Skills</text>
  <text x="300" y="252" text-anchor="middle" fill="#6b7280" font-size="9">Extensible</text>
</svg>
