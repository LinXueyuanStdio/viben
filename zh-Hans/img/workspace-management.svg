<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="workspaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
  </defs>
  <!-- Workspace cards -->
  <!-- Card 1 - Project A -->
  <rect x="30" y="60" width="100" height="120" rx="8" fill="white" stroke="#e5e7eb" stroke-width="2"/>
  <rect x="30" y="60" width="100" height="30" rx="8" fill="url(#workspaceGrad)"/>
  <rect x="30" y="78" width="100" height="12" fill="url(#workspaceGrad)"/>
  <text x="80" y="82" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Project A</text>
  <rect x="42" y="105" width="60" height="6" rx="2" fill="#d1d5db"/>
  <rect x="42" y="118" width="45" height="6" rx="2" fill="#d1d5db"/>
  <circle cx="50" cy="150" r="8" fill="#22c55e"/>
  <text x="62" y="154" fill="#6b7280" font-size="10">MCP</text>

  <!-- Card 2 - Project B (center, elevated) -->
  <rect x="150" y="40" width="100" height="140" rx="8" fill="white" stroke="#f59e0b" stroke-width="2"/>
  <rect x="150" y="40" width="100" height="30" rx="8" fill="url(#workspaceGrad)"/>
  <rect x="150" y="58" width="100" height="12" fill="url(#workspaceGrad)"/>
  <text x="200" y="62" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Project B</text>
  <rect x="162" y="85" width="60" height="6" rx="2" fill="#fbbf24"/>
  <rect x="162" y="98" width="45" height="6" rx="2" fill="#fcd34d"/>
  <circle cx="170" y="130" r="8" fill="#22c55e"/>
  <text x="182" y="134" fill="#6b7280" font-size="10">MCP</text>
  <circle cx="170" y="155" r="8" fill="#3b82f6"/>
  <text x="182" y="159" fill="#6b7280" font-size="10">Skills</text>

  <!-- Card 3 - Project C -->
  <rect x="270" y="60" width="100" height="120" rx="8" fill="white" stroke="#e5e7eb" stroke-width="2"/>
  <rect x="270" y="60" width="100" height="30" rx="8" fill="url(#workspaceGrad)"/>
  <rect x="270" y="78" width="100" height="12" fill="url(#workspaceGrad)"/>
  <text x="320" y="82" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Project C</text>
  <rect x="282" y="105" width="60" height="6" rx="2" fill="#d1d5db"/>
  <rect x="282" y="118" width="45" height="6" rx="2" fill="#d1d5db"/>
  <circle cx="290" cy="150" r="8" fill="#8b5cf6"/>
  <text x="302" y="154" fill="#6b7280" font-size="10">Agent</text>

  <!-- Folder icon at bottom -->
  <path d="M170 220 L180 210 L220 210 L230 220 L230 260 L170 260 Z" fill="#fbbf24"/>
  <rect x="170" y="225" width="60" height="35" rx="4" fill="#f59e0b"/>
  <text x="200" y="248" text-anchor="middle" fill="white" font-size="10" font-weight="bold">3 Workspaces</text>
</svg>
