<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="connGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
  </defs>
  <!-- Central hub -->
  <circle cx="200" cy="150" r="40" fill="url(#connGrad)"/>
  <text x="200" y="158" text-anchor="middle" fill="white" font-size="24" font-weight="bold">MCP</text>

  <!-- Connected nodes -->
  <!-- Top node - Claude -->
  <circle cx="200" cy="50" r="25" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
  <text x="200" y="55" text-anchor="middle" fill="#374151" font-size="10">Claude</text>
  <line x1="200" y1="75" x2="200" y2="110" stroke="#93c5fd" stroke-width="3"/>

  <!-- Left node - arXiv -->
  <circle cx="80" cy="150" r="25" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
  <text x="80" y="155" text-anchor="middle" fill="#374151" font-size="10">arXiv</text>
  <line x1="105" y1="150" x2="160" y2="150" stroke="#93c5fd" stroke-width="3"/>

  <!-- Right node - PubMed -->
  <circle cx="320" cy="150" r="25" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
  <text x="320" y="155" text-anchor="middle" fill="#374151" font-size="10">PubMed</text>
  <line x1="295" y1="150" x2="240" y2="150" stroke="#93c5fd" stroke-width="3"/>

  <!-- Bottom left - Semantic -->
  <circle cx="120" cy="240" r="25" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
  <text x="120" y="245" text-anchor="middle" fill="#374151" font-size="8">Semantic</text>
  <line x1="140" y1="220" x2="175" y2="185" stroke="#93c5fd" stroke-width="3"/>

  <!-- Bottom right - IEEE -->
  <circle cx="280" cy="240" r="25" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
  <text x="280" y="245" text-anchor="middle" fill="#374151" font-size="10">IEEE</text>
  <line x1="260" y1="220" x2="225" y2="185" stroke="#93c5fd" stroke-width="3"/>
</svg>
