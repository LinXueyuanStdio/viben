[workspace]
resolver = "2"
members = [
    "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["LinXueyuanStdio"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "compat", "rt"] }
tokio-stream = "0.1"

# Web framework
axum = { version = "0.7", features = ["macros", "ws"] }
tower-http = { version = "0.5", features = ["cors", "request-id", "trace", "fs"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Async traits
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# TypeScript type generation
ts-rs = { version = "10", features = ["uuid-impl", "chrono-impl", "serde-json-impl"] }

# Schema generation
schemars = { version = "0.8", features = ["derive", "chrono"] }

# Process management
command-group = { version = "5.0", features = ["with-tokio"] }

# Enum dispatch for trait implementations
enum_dispatch = "0.3"

# Futures and streams
futures = "0.3"
futures-util = "0.3"

# Other utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
regex = "1.11"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# PTY support
portable-pty = "0.8"

# Base64 encoding
base64 = "0.22"

# JSON Patch (RFC 6902)
json-patch = "3.0"

# CLI
clap = { version = "4", features = ["derive"] }

# Cron job scheduling
tokio-cron-scheduler = "0.13"

[profile.release]
debug = 1
split-debuginfo = "packed"
strip = true
