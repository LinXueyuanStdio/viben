[package]
name = "viben-core"
version = "0.1.0"
edition = "2021"
description = "Viben core library - shared configuration, agents, providers, models management"
authors = ["LinXueyuanStdio"]
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
tokio = { version = "1", features = ["fs", "io-util"] }
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
tempfile = "3.10"
