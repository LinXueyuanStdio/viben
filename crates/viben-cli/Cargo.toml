[package]
name = "viben-cli"
version = "0.1.0"
edition = "2021"
description = "Viben CLI - Orchestrate AI agent clusters in your local workspace"
authors = ["LinXueyuanStdio"]
license = "MIT"

[[bin]]
name = "viben"
path = "src/main.rs"

[dependencies]
viben-core = { path = "../viben-core" }
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
anyhow = "1.0"
