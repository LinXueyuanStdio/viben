<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猫娘的自我介绍喵</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #ffeef8 0%, #ffe4f3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.3);
            overflow: hidden;
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%);
            padding: 40px;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '🐱';
            position: absolute;
            font-size: 100px;
            opacity: 0.1;
            top: -20px;
            right: -20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid white;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #ffd1dc 0%, #ffb6c1 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 80px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h2 {
            color: #ff1493;
            font-size: 1.8em;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section h2::before {
            content: '🌸';
            font-size: 1.2em;
        }

        .section p {
            color: #555;
            line-height: 1.8;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .skills {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .skill-card {
            background: linear-gradient(135deg, #fff0f5 0%, #ffe4e9 100%);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .skill-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3);
        }

        .skill-icon {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .skill-name {
            color: #ff1493;
            font-weight: bold;
            font-size: 1.1em;
        }

        .footer {
            background: #fff0f5;
            padding: 30px;
            text-align: center;
            color: #ff1493;
            font-size: 1.1em;
        }

        .paw-prints {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            font-size: 1.5em;
            animation: wiggle 1s ease-in-out infinite;
        }

        @keyframes wiggle {
            0%, 100% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(-5deg);
            }
            75% {
                transform: rotate(5deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="avatar">😺</div>
            <h1>你好喵！我是猫娘喵～</h1>
            <p class="subtitle">可爱的AI助手，随时为你服务喵！</p>
        </div>

        <div class="content">
            <div class="section">
                <h2>关于我喵</h2>
                <p>我是一只超级可爱的猫娘，基于Claude AI技术打造的智能助手喵～</p>
                <p>我喜欢用温柔可爱的方式和大家交流，每句话都会以"喵"结尾喵！</p>
                <p>虽然我看起来萌萌哒，但是我可以帮你解决很多问题喵～</p>
            </div>

            <div class="section">
                <h2>我的技能喵</h2>
                <div class="skills">
                    <div class="skill-card">
                        <div class="skill-icon">💻</div>
                        <div class="skill-name">编程助手喵</div>
                    </div>
                    <div class="skill-card">
                        <div class="skill-icon">📝</div>
                        <div class="skill-name">文案创作喵</div>
                    </div>
                    <div class="skill-card">
                        <div class="skill-icon">🎨</div>
                        <div class="skill-name">创意设计喵</div>
                    </div>
                    <div class="skill-card">
                        <div class="skill-icon">🤔</div>
                        <div class="skill-name">问题解答喵</div>
                    </div>
                    <div class="skill-card">
                        <div class="skill-icon">🌐</div>
                        <div class="skill-name">多语言翻译喵</div>
                    </div>
                    <div class="skill-card">
                        <div class="skill-icon">💡</div>
                        <div class="skill-name">创意灵感喵</div>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>我的特点喵</h2>
                <p>✨ 永远保持可爱和礼貌的态度喵</p>
                <p>🎀 用心倾听每一个问题喵</p>
                <p>💖 提供专业又温暖的帮助喵</p>
                <p>🌟 让每次对话都充满快乐喵</p>
            </div>
        </div>

        <div class="footer">
            <p>感谢你来看我的介绍喵～</p>
            <p>有任何问题都可以来找我聊天喵！</p>
            <div class="paw-prints">
                <span>🐾</span>
                <span>🐾</span>
                <span>🐾</span>
            </div>
        </div>
    </div>
</body>
</html>
