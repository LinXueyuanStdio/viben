<svg width="400" height="180" viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Brand gradient - brightened teal for better vibrancy -->
    <linearGradient id="viben-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDB813"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>

    <!-- Shine sweep effect - reduced opacity -->
    <linearGradient id="shine" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;200%" dur="2.5s" repeatCount="indefinite" begin="2.2s"/>
      <animate attributeName="x2" values="0%;300%" dur="2.5s" repeatCount="indefinite" begin="2.2s"/>
    </linearGradient>

    <!-- Soft glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Star glow - subtle -->
    <filter id="star-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft shadow for main character -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- ============ Confetti particles - reduced opacity ============ -->
  <!-- Left side - gold confetti -->
  <g>
    <rect x="55" y="100" width="10" height="4" rx="2" fill="#FDB813" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="1.6s" begin="1.4s" fill="freeze" keyTimes="0;0.15;1"/>
      <animate attributeName="y" values="100;15" dur="1.6s" begin="1.4s" fill="freeze" calcMode="spline" keySplines="0.15 0.85 0.35 1"/>
      <animate attributeName="x" values="55;40" dur="1.6s" begin="1.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="rotate" values="0 60 102;540 45 17" dur="1.6s" begin="1.4s" fill="freeze"/>
    </rect>
    <rect x="85" y="105" width="8" height="3" rx="1.5" fill="#FFE066" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="1.8s" begin="1.5s" fill="freeze" keyTimes="0;0.12;1"/>
      <animate attributeName="y" values="105;10" dur="1.8s" begin="1.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.7 0.25 1"/>
      <animate attributeName="x" values="85;70" dur="1.8s" begin="1.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="rotate" values="30 89 106;-330 74 11" dur="1.8s" begin="1.5s" fill="freeze"/>
    </rect>
    <circle cx="65" cy="100" r="4" fill="#FDB813" opacity="0">
      <animate attributeName="opacity" values="0;0.65;0" dur="1.5s" begin="1.45s" fill="freeze" keyTimes="0;0.15;1"/>
      <animate attributeName="cy" values="100;25" dur="1.5s" begin="1.45s" fill="freeze" calcMode="spline" keySplines="0.1 0.9 0.4 1"/>
      <animate attributeName="cx" values="65;50" dur="1.5s" begin="1.45s" fill="freeze"/>
      <animate attributeName="r" values="4;2" dur="1.5s" begin="1.45s" fill="freeze"/>
    </circle>
    <circle cx="100" cy="100" r="3" fill="#FFE066" opacity="0">
      <animate attributeName="opacity" values="0;0.55;0" dur="1.4s" begin="1.55s" fill="freeze" keyTimes="0;0.12;1"/>
      <animate attributeName="cy" values="100;35" dur="1.4s" begin="1.55s" fill="freeze" calcMode="spline" keySplines="0.1 0.9 0.4 1"/>
    </circle>
    <polygon points="75,100 80,105 70,105" fill="#FDB813" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="1.7s" begin="1.6s" fill="freeze" keyTimes="0;0.1;1"/>
      <animate attributeName="points" values="75,100 80,105 70,105;75,20 80,25 70,25" dur="1.7s" begin="1.6s" fill="freeze" calcMode="spline" keySplines="0.15 0.85 0.35 1"/>
      <animateTransform attributeName="transform" type="rotate" values="0 75 102;720 75 22" dur="1.7s" begin="1.6s" fill="freeze"/>
    </polygon>
  </g>

  <!-- Right side - teal confetti -->
  <g>
    <rect x="335" y="100" width="10" height="4" rx="2" fill="#2DD4BF" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="1.6s" begin="1.4s" fill="freeze" keyTimes="0;0.15;1"/>
      <animate attributeName="y" values="100;15" dur="1.6s" begin="1.4s" fill="freeze" calcMode="spline" keySplines="0.15 0.85 0.35 1"/>
      <animate attributeName="x" values="335;355" dur="1.6s" begin="1.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="rotate" values="0 340 102;-540 360 17" dur="1.6s" begin="1.4s" fill="freeze"/>
    </rect>
    <rect x="305" y="105" width="8" height="3" rx="1.5" fill="#81E6D9" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="1.8s" begin="1.5s" fill="freeze" keyTimes="0;0.12;1"/>
      <animate attributeName="y" values="105;10" dur="1.8s" begin="1.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.7 0.25 1"/>
      <animate attributeName="x" values="305;320" dur="1.8s" begin="1.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="rotate" values="-30 309 106;330 324 11" dur="1.8s" begin="1.5s" fill="freeze"/>
    </rect>
    <circle cx="335" cy="100" r="4" fill="#2DD4BF" opacity="0">
      <animate attributeName="opacity" values="0;0.65;0" dur="1.5s" begin="1.45s" fill="freeze" keyTimes="0;0.15;1"/>
      <animate attributeName="cy" values="100;25" dur="1.5s" begin="1.45s" fill="freeze" calcMode="spline" keySplines="0.1 0.9 0.4 1"/>
      <animate attributeName="cx" values="335;350" dur="1.5s" begin="1.45s" fill="freeze"/>
      <animate attributeName="r" values="4;2" dur="1.5s" begin="1.45s" fill="freeze"/>
    </circle>
    <circle cx="300" cy="100" r="3" fill="#81E6D9" opacity="0">
      <animate attributeName="opacity" values="0;0.55;0" dur="1.4s" begin="1.55s" fill="freeze" keyTimes="0;0.12;1"/>
      <animate attributeName="cy" values="100;35" dur="1.4s" begin="1.55s" fill="freeze" calcMode="spline" keySplines="0.1 0.9 0.4 1"/>
    </circle>
    <polygon points="325,100 330,105 320,105" fill="#2DD4BF" opacity="0">
      <animate attributeName="opacity" values="0;0.6;0" dur="1.7s" begin="1.6s" fill="freeze" keyTimes="0;0.1;1"/>
      <animate attributeName="points" values="325,100 330,105 320,105;325,20 330,25 320,25" dur="1.7s" begin="1.6s" fill="freeze" calcMode="spline" keySplines="0.15 0.85 0.35 1"/>
      <animateTransform attributeName="transform" type="rotate" values="0 325 102;-720 325 22" dur="1.7s" begin="1.6s" fill="freeze"/>
    </polygon>
  </g>

  <!-- ============ Main character: Cute <V> ============ -->
  <g filter="url(#soft-shadow)">
    <!-- Bounce entrance - improved physics with proper keySplines -->
    <animateTransform attributeName="transform" type="translate"
      values="200,130;200,78;200,92;200,82;200,87;200,85"
      keyTimes="0;0.3;0.5;0.65;0.8;1"
      dur="1s" fill="freeze" calcMode="spline"
      keySplines="0.12 0.8 0.3 1;0.5 0 0.7 0.4;0.3 0.8 0.4 1;0.5 0 0.65 0.5;0.35 0.1 0.25 1"/>

    <!-- Squash and stretch during bounce -->
    <animateTransform attributeName="transform" type="scale"
      values="1 1;1.08 0.92;0.94 1.06;1.02 0.98;0.99 1.01;1 1"
      keyTimes="0;0.3;0.5;0.65;0.8;1"
      dur="1s" fill="freeze" calcMode="spline"
      keySplines="0.12 0.8 0.3 1;0.5 0 0.7 0.4;0.3 0.8 0.4 1;0.5 0 0.65 0.5;0.35 0.1 0.25 1"
      additive="sum"/>

    <!-- Breathing animation wrapper -->
    <g>
      <animateTransform attributeName="transform" type="scale"
        values="1,1;1.02,0.98;1,1;0.98,1.02;1,1"
        dur="2s" repeatCount="indefinite" begin="1.2s"
        calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>

      <!-- Body: <V> shape with glow -->
      <g filter="url(#glow)">
        <!-- < left bracket - left arm - synchronized outward celebration -->
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="0 -20 0;-15 -20 0;5 -20 0;-12 -20 0;0 -20 0"
            dur="1.2s" repeatCount="indefinite" begin="1.5s"
            calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
          <path d="M-25,-25 L-42,0 L-25,25" fill="none" stroke="#FDB813" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0">
            <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.3s" fill="freeze"/>
          </path>
        </g>

        <!-- V center - body - thicker stroke -->
        <path d="M-15,-22 L0,22 L15,-22" fill="none" stroke="url(#viben-grad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="100" stroke-dashoffset="100">
          <animate attributeName="stroke-dashoffset" values="100;0" dur="0.3s" fill="freeze" begin="0s"/>
        </path>

        <!-- > right bracket - right arm - synchronized outward celebration -->
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="0 20 0;15 20 0;-5 20 0;12 20 0;0 20 0"
            dur="1.2s" repeatCount="indefinite" begin="1.5s"
            calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
          <path d="M25,-25 L42,0 L25,25" fill="none" stroke="#2DD4BF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0">
            <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.3s" fill="freeze"/>
          </path>
        </g>
      </g>

      <!-- Shine sweep effect -->
      <rect x="-50" y="-30" width="100" height="60" fill="url(#shine)" opacity="0.4"/>
    </g>
  </g>

  <!-- ============ "NEW RELEASE" badge ============ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.3s" fill="freeze"/>

    <!-- Subtle pulse -->
    <animateTransform attributeName="transform" type="scale"
      values="1;1.015;1" dur="2s" repeatCount="indefinite" begin="2s" additive="sum"/>

    <!-- Background pill -->
    <rect x="150" y="132" width="100" height="28" rx="14" fill="url(#viben-grad)" opacity="0.1"/>
    <rect x="150" y="132" width="100" height="28" rx="14" fill="none" stroke="url(#viben-grad)" stroke-width="1.5" opacity="0.4"/>

    <!-- Text -->
    <text x="200" y="151" font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" font-size="12" font-weight="700" fill="url(#viben-grad)" text-anchor="middle" letter-spacing="1.2">
      NEW RELEASE
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite" begin="2s"/>
    </text>
  </g>

  <!-- ============ Star decorations - reduced intensity ============ -->
  <!-- Top left star - moved inward -->
  <g opacity="0" filter="url(#star-glow)">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.6s" fill="freeze"/>
    <g transform="translate(65, 38)">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="12s" repeatCount="indefinite" begin="1.6s" additive="sum"/>
      <path d="M0,-6 L1.5,-1.5 L6,0 L1.5,1.5 L0,6 L-1.5,1.5 L-6,0 L-1.5,-1.5 Z" fill="#FDB813">
        <animate attributeName="opacity" values="0.4;0.7;0.4" dur="2.5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Top right star - moved inward -->
  <g opacity="0" filter="url(#star-glow)">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.7s" fill="freeze"/>
    <g transform="translate(335, 42)">
      <animateTransform attributeName="transform" type="rotate" values="0;-360" dur="11s" repeatCount="indefinite" begin="1.7s" additive="sum"/>
      <path d="M0,-5 L1.2,-1.2 L5,0 L1.2,1.2 L0,5 L-1.2,1.2 L-5,0 L-1.2,-1.2 Z" fill="#2DD4BF">
        <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Small twinkling stars - reduced and moved -->
  <circle cx="55" cy="105" r="2" fill="#FDB813" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="2.5s" repeatCount="indefinite" begin="2s"/>
  </circle>
  <circle cx="345" cy="110" r="2" fill="#2DD4BF" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="2.8s" repeatCount="indefinite" begin="2.2s"/>
  </circle>
  <circle cx="115" cy="125" r="1.5" fill="#FFE066" opacity="0">
    <animate attributeName="opacity" values="0;0.4;0" dur="3s" repeatCount="indefinite" begin="2.4s"/>
  </circle>
  <circle cx="285" cy="125" r="1.5" fill="#81E6D9" opacity="0">
    <animate attributeName="opacity" values="0;0.4;0" dur="2.8s" repeatCount="indefinite" begin="2.1s"/>
  </circle>
</svg>
