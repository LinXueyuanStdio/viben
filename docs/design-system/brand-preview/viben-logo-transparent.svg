<svg width="512" height="512" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="viben-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FDB813"/>
      <stop offset="100%" style="stop-color:#38B2AC"/>
    </linearGradient>
  </defs>
  <!-- 透明背景，只有 <V> 符号 -->
