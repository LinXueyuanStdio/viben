<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Book/Document base -->
  <rect x="15" y="20" width="50" height="65" rx="3" fill="url(#grad1)"/>
  <rect x="20" y="25" width="40" height="55" rx="2" fill="white"/>
  <!-- Lines representing text -->
  <rect x="25" y="32" width="30" height="3" rx="1" fill="#93c5fd"/>
  <rect x="25" y="40" width="25" height="3" rx="1" fill="#93c5fd"/>
  <rect x="25" y="48" width="28" height="3" rx="1" fill="#93c5fd"/>
  <rect x="25" y="56" width="22" height="3" rx="1" fill="#93c5fd"/>
  <!-- Magnifying glass -->
  <circle cx="65" cy="55" r="20" fill="none" stroke="url(#grad1)" stroke-width="6"/>
  <line x1="78" y1="68" x2="92" y2="82" stroke="url(#grad1)" stroke-width="6" stroke-linecap="round"/>
  <!-- Search highlight -->
  <circle cx="65" cy="55" r="12" fill="#dbeafe" opacity="0.5"/>
</svg>
