<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="easyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
  </defs>
  <!-- Terminal window -->
  <rect x="50" y="50" width="300" height="200" rx="10" fill="#1f2937"/>
  <!-- Window controls -->
  <circle cx="75" cy="70" r="8" fill="#ef4444"/>
  <circle cx="100" cy="70" r="8" fill="#f59e0b"/>
  <circle cx="125" cy="70" r="8" fill="#22c55e"/>
  <!-- Terminal content -->
  <text x="70" y="110" fill="#60a5fa" font-family="monospace" font-size="14">$ pip install browse-mcp</text>
  <text x="70" y="140" fill="#22c55e" font-family="monospace" font-size="14">Successfully installed!</text>
  <text x="70" y="180" fill="#60a5fa" font-family="monospace" font-size="14">$ browse-mcp</text>
  <text x="70" y="210" fill="#9ca3af" font-family="monospace" font-size="14">MCP server running...</text>
  <!-- Cursor -->
  <rect x="220" y="198" width="8" height="16" fill="#60a5fa">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
