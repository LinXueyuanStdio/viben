description = "Check if your code follows the frontend development guidelines"

prompt = """
Check if the code you just wrote follows the frontend development guidelines.

Execute these steps:
1. Run `git status` to see modified files
2. Read `docs/specs/frontend/index.md` to understand which guidelines apply
3. Based on what you changed, read the relevant guideline files:
   - Component changes -> `docs/specs/frontend/component-guidelines.md`
   - Hook changes -> `docs/specs/frontend/hook-guidelines.md`
   - State changes -> `docs/specs/frontend/state-management.md`
   - Type changes -> `docs/specs/frontend/type-safety.md`
   - Any changes -> `docs/specs/frontend/quality-guidelines.md`
4. Review your code against the guidelines
5. Report any violations and fix them if found
"""
